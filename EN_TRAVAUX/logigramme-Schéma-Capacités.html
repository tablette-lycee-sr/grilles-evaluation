<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exploitation des documents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Open Sans (texte) + Material Symbols (icônes « target » et « info ») -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<style>
  /* --u = unité de base : 1px donne la taille d'origine (carte de 278 × 78 px).
     Changer sa valeur (ex. 1.5px, 2px) agrandit ou réduit tout le composant. */
  :root {
    --u: 1px;
    --fond: #2d3034;
    --bouton: #44474c;
    --gris: #858585;
    --bleu: #4ba0d6;
    --vert: #17a13f;
    --violet: #a44cbd;
    --rouge-jauge: #a14732;
    --jaune-jauge: #c3a91e;
    --vert-jauge: #099332;
  }
  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    background: #fff;
    font-family: "Open Sans", sans-serif;
  }

  /* ---------- Carte ---------- */
  .carte {
    width: calc(278 * var(--u)); height: calc(78 * var(--u)); padding: calc(3 * var(--u));           /* 3 + 1 de liseré = 4 */
    border: calc(1 * var(--u)) solid #000;                 /* liseré noir */
    display: grid;
    grid-template-columns: calc(37 * var(--u)) 1fr calc(37 * var(--u));   /* gauche | centre | capacités */
    grid-template-rows: calc(24 * var(--u)) 1fr;           /* titre  | corps */
    column-gap: calc(4 * var(--u));
    border-radius: calc(10 * var(--u));
    background: var(--fond);
    color: #fff;
  }

  /* ---------- Titre ---------- */
  .titre {
    grid-column: 1 / 3;
    display: flex; align-items: center; gap: calc(6 * var(--u));
    margin: 0; font-size: calc(15 * var(--u)); font-weight: 400;
  }
  .titre .material-symbols-outlined { font-size: calc(24 * var(--u)); color: var(--gris); }

  /* ---------- Colonne de gauche : note + aide ---------- */
  .gauche {
    grid-area: 2 / 1; align-self: end;
    height: calc(42 * var(--u));
    display: flex; flex-direction: column; gap: calc(2 * var(--u));
  }
  .note {
    height: calc(17 * var(--u));
    display: grid; place-items: center;
    border: calc(1 * var(--u)) solid var(--gris); border-radius: calc(9 * var(--u));
    font-size: calc(10.5 * var(--u));
  }
  .aide {
    flex: 1;
    display: grid; place-items: center;
    border-radius: calc(10 * var(--u));
    background: var(--gris); color: var(--fond);
  }
  .aide .material-symbols-outlined { font-size: calc(20 * var(--u)); }

  /* ---------- Centre : choix + jauge ---------- */
  .centre {
    grid-area: 2 / 2; align-self: end; justify-self: end;
    height: calc(42 * var(--u));
    display: flex; flex-direction: column;
  }
  .choix { display: flex; align-items: center; gap: calc(3 * var(--u)); height: calc(22 * var(--u)); }

  .alerte {
    width: calc(23 * var(--u)); height: calc(20 * var(--u)); padding-bottom: calc(3 * var(--u));
    display: flex; align-items: flex-end; justify-content: center;
    background: var(--bouton);
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
    font-size: calc(9 * var(--u)); font-weight: 700; line-height: 1;
  }
  .bouton {
    width: calc(37 * var(--u)); height: calc(22 * var(--u));
    display: grid; place-items: center;
    border-radius: calc(10 * var(--u));
    background: var(--bouton);
    font-size: calc(8 * var(--u));
  }
  .bouton.actif { height: calc(24 * var(--u)); border: calc(3 * var(--u)) solid var(--vert); }   /* « A » sélectionné */
  .rond {
    width: calc(24 * var(--u)); height: calc(22 * var(--u));
    display: grid; place-items: center;
    border-radius: 50%;
    background: var(--bleu);
    font-size: calc(8 * var(--u));
  }

  /* Jauge alignée sous NA / ECA / A ; séparateurs noirs de 1 px à 30 % et 66 % */
  .jauge {
    position: relative;
    width: calc(117 * var(--u)); height: calc(7 * var(--u));
    margin: auto 0 auto calc(26 * var(--u));               /* 26 px = triangle (23) + gap (3) */
    border-radius: calc(4 * var(--u));
    background: linear-gradient(90deg,
      var(--rouge-jauge) 0 calc(30% - .5 * var(--u)),
      #000 0 calc(30% + .5 * var(--u)),
      var(--jaune-jauge) 0 calc(66% - .5 * var(--u)),
      #000 0 calc(66% + .5 * var(--u)),
      var(--vert-jauge) 0);
  }
  .jauge::after {                           /* curseur */
    content: "";
    position: absolute; right: 0; top: 50%;
    width: calc(13 * var(--u)); height: calc(13 * var(--u)); transform: translateY(-50%);
    border: calc(2 * var(--u)) solid #fff; border-radius: 50%;
    background: var(--bouton);
  }

  /* ---------- Capacités ---------- */
  .capacites {
    grid-area: 1 / 3 / 3; align-self: end;
    height: calc(52 * var(--u)); padding: calc(4 * var(--u)) 0 calc(3 * var(--u));
    border: calc(1 * var(--u)) solid #000;                 /* liseré noir */
    display: flex; flex-direction: column; align-items: center;
    border-radius: calc(10 * var(--u));
    background: var(--violet); color: #000;
  }
  .ratio { font-size: calc(14.5 * var(--u)); line-height: 1.1; }
  .libelle { margin-top: calc(1 * var(--u)); font-size: calc(7 * var(--u)); line-height: 1.2; }
  .fleche {
    margin-top: auto; width: calc(17 * var(--u)); height: calc(8 * var(--u));
    background: #1f1f1f;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
  }
</style>
</head>
<body>

<div class="carte">

  <h1 class="titre">
    <span class="material-symbols-outlined" aria-hidden="true">target</span>
    Exploitation des documents
  </h1>

  <div class="gauche">
    <div class="note">10</div>
    <div class="aide"><span class="material-symbols-outlined" aria-label="Aide">info</span></div>
  </div>

  <div class="centre">
    <div class="choix">
      <div class="alerte">!</div>
      <div class="bouton">NA</div>
      <div class="bouton">ECA</div>
      <div class="bouton actif">A</div>
      <div class="rond">D</div>
    </div>
    <div class="jauge"></div>
  </div>

  <div class="capacites">
    <div class="ratio">2/3</div>
    <div class="libelle">capacités</div>
    <div class="fleche"></div>
  </div>

</div>

</body>
</html>
