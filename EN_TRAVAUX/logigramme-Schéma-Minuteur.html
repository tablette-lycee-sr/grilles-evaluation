<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestion du temps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Open Sans (texte) + Material Symbols (icônes) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<style>
  /* --u = unité de base : 1px donne la taille d'origine (carte de 278 × 90 px).
     Changer sa valeur (ex. 1.5px, 2px) agrandit ou réduit tout le composant. */
  :root {
    --fond: #2d3034;
    --bouton: #44474c;
    --gris: #858585;
    --jaune: #ffd737;
    --vert: #17a13f;
    --violet: #a44cbd;
    --rouge-jauge: #a14732;
    --jaune-jauge-debut: #a2a11c;
    --jaune-jauge-fin: #b58526;
    --vert-jauge: #099332;
  }
  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    background: #fff;
    font-family: "Open Sans", sans-serif;
  }

  /* ---------- Carte ---------- */
  .carte {
    --u: 1px;
    width: calc(278 * var(--u)); height: calc(90 * var(--u)); padding: calc(3 * var(--u));           /* 3 + 1 de liseré = 4 */
    border: calc(1 * var(--u)) solid #000;                             /* liseré noir */
    display: grid;
    grid-template-columns: calc(37 * var(--u)) 1fr calc(65.5 * var(--u));             /* gauche | centre | droite */
    grid-template-rows: calc(24 * var(--u)) calc(29 * var(--u)) calc(29 * var(--u));                 /* titre | boutons | jauge */
    grid-template-areas:
      "titre   titre    titre"
      "gauche  boutons  capacite"
      "gauche  jauge    retour";
    column-gap: calc(3 * var(--u));
    border-radius: calc(10 * var(--u));
    background: var(--fond);
    color: #fff;
  }

  /* ---------- Titre ---------- */
  .titre {
    grid-area: titre;
    display: flex; align-items: center; gap: calc(6 * var(--u));
    margin: 0; font-size: calc(15 * var(--u)); font-weight: 400;
  }
  .titre .material-symbols-outlined { font-size: calc(24 * var(--u)); color: var(--gris); }

  /* ---------- Colonne de gauche : note + aide ---------- */
  .gauche {
    grid-area: gauche; align-self: end;
    height: calc(43 * var(--u));
    display: flex; flex-direction: column; gap: calc(2 * var(--u));
  }
  .note {
    height: calc(17 * var(--u));
    display: grid; place-items: center;
    border: calc(1 * var(--u)) solid var(--gris); border-radius: calc(9 * var(--u));
    font-size: calc(10.5 * var(--u));
  }
  .aide {
    flex: 1;
    display: grid; place-items: center;
    border-radius: calc(10 * var(--u));
    background: var(--gris); color: var(--fond);
  }
  .aide .material-symbols-outlined { font-size: calc(20 * var(--u)); }

  /* ---------- Rangée de boutons ---------- */
  .boutons {
    grid-area: boutons; justify-self: end; align-self: center;
    display: flex; align-items: center; gap: calc(3 * var(--u));
  }
  .alerte {
    width: calc(23 * var(--u)); height: calc(20 * var(--u)); padding-bottom: calc(3 * var(--u));
    display: flex; align-items: flex-end; justify-content: center;
    background: var(--bouton);
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
    font-size: calc(9 * var(--u)); font-weight: 700; line-height: 1;
  }
  .bouton {
    width: calc(37 * var(--u)); height: calc(22 * var(--u));
    display: grid; place-items: center;
    border-radius: calc(10 * var(--u));
    background: var(--bouton);
    font-size: calc(8 * var(--u));
  }
  .bouton.actif { background: var(--jaune); color: #000; font-weight: 700; }   /* « ECA » sélectionné */

  /* ---------- Capacité : minuteur ---------- */
  .capacite {
    grid-area: capacite; align-self: center;
    height: calc(28 * var(--u)); padding: 0 calc(4 * var(--u));
    display: flex; align-items: center; justify-content: space-between;
    border: calc(1 * var(--u)) solid #000; border-radius: calc(14 * var(--u));        /* liseré noir */
    background: var(--violet); color: #000;
    font-size: calc(12 * var(--u));
  }
  .capacite .material-symbols-outlined { font-size: calc(24 * var(--u)); color: #1f1f1f; }

  /* ---------- Jauge en U (aller en haut, retour en bas) ---------- */
  .jauge {
    --demi: calc(.5 * var(--u));                        /* demi-épaisseur des séparateurs noirs */
    --valeur: 56%;                                      /* position du curseur */
    --degrade: linear-gradient(90deg,
      var(--rouge-jauge) 0 calc(33.5% - var(--demi)),
      #000 0 calc(33.5% + var(--demi)),
      var(--jaune-jauge-debut) 0,
      var(--jaune-jauge-fin) calc(72.5% - var(--demi)),
      #000 0 calc(72.5% + var(--demi)),
      var(--vert-jauge) 0);
    grid-area: jauge; justify-self: end; align-self: center;
    position: relative;
    width: calc(117 * var(--u)); height: calc(20 * var(--u));                         /* = NA + ECA + A + 2 espaces */
  }
  .jauge .piste {                                       /* deux pistes de 6 px */
    position: absolute; left: 0; width: calc(100% - calc(9 * var(--u))); height: calc(6 * var(--u));
    border-radius: calc(3 * var(--u)) 0 0 calc(3 * var(--u));
    background: var(--degrade);
  }
  .jauge .haut { top: 0; }
  .jauge .bas  { bottom: 0; }
  .jauge .retour-u {                                    /* demi-cercle vert qui relie les pistes */
    position: absolute; top: 0; right: 0; bottom: 0; width: calc(10 * var(--u));
    border: calc(6 * var(--u)) solid var(--vert-jauge); border-left: 0;
    border-radius: 0 calc(10 * var(--u)) calc(10 * var(--u)) 0;
  }
  .jauge .curseur {
    position: absolute; top: calc(3 * var(--u)); left: var(--valeur);
    width: calc(13 * var(--u)); height: calc(13 * var(--u)); transform: translate(-50%, -50%);
    border: calc(2 * var(--u)) solid #fff; border-radius: 50%;
    background: var(--bouton);
  }

  /* ---------- Durée restante + remise à zéro ---------- */
  .retour {
    grid-area: retour; padding-left: calc(6 * var(--u));
    display: flex; justify-content: space-between;
  }
  .duree { align-self: center; color: var(--vert); font-size: calc(12 * var(--u)); font-weight: 700; }
  .raz {
    align-self: end;
    width: calc(37 * var(--u)); height: calc(18.5 * var(--u));
    display: flex; align-items: center; justify-content: center; gap: calc(1 * var(--u));
    border: calc(1 * var(--u)) solid #000; border-radius: calc(10 * var(--u));        /* liseré noir */
    background: var(--gris); color: #000;
    font-size: calc(10.5 * var(--u));
  }
  .raz .material-symbols-outlined { font-size: calc(16 * var(--u)); }
</style>
</head>
<body>

<div class="carte">

  <h1 class="titre">
    <span class="material-symbols-outlined" aria-hidden="true">hourglass_empty</span>
    Gestion du temps
  </h1>

  <div class="gauche">
    <div class="note">10</div>
    <div class="aide"><span class="material-symbols-outlined" aria-label="Aide">info</span></div>
  </div>

  <div class="boutons">
    <div class="alerte">!</div>
    <div class="bouton">NA</div>
    <div class="bouton actif">ECA</div>
    <div class="bouton">A</div>
  </div>

  <div class="capacite">
    <span class="material-symbols-outlined" aria-hidden="true">timer_play</span>
    3'25"
  </div>

  <div class="jauge">
    <i class="piste haut"></i>
    <i class="piste bas"></i>
    <i class="retour-u"></i>
    <i class="curseur"></i>
  </div>

  <div class="retour">
    <div class="duree">5'</div>
    <div class="raz">0<span class="material-symbols-outlined" aria-label="Remettre à zéro">undo</span></div>
  </div>

</div>

</body>
</html>
