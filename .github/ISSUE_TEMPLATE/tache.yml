name: Tâche
description: Nouvelle tâche de développement (extraite de docs/STATUS.md ou décidée par l'utilisateur)
labels: ["tâche"]
body:
  - type: markdown
    attributes:
      value: |
        Une issue = une tâche, confiée à un agent (voir `AGENTS.md`). Préciser le niveau de risque
        (`agent:ok`, `agent:prudent`, `sensible`, `humain`) d'après `docs/STATUS.md`.
  - type: dropdown
    id: niveau
    attributes:
      label: Niveau de risque
      options:
        - agent:ok
        - agent:prudent
        - sensible
        - humain
    validations:
      required: true
  - type: textarea
    id: objectif
    attributes:
      label: Objectif
      description: Ce qui doit être vrai à la fin de la tâche (une phrase).
    validations:
      required: true
  - type: textarea
    id: criteres
    attributes:
      label: Critères d'acceptation
      description: Tests attendus, fichiers concernés, spec à relire (ex. `docs/spec/donnees.md`).
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Pièges connus / zones sensibles
      description: Rappels d'`AGENTS.md`, marqueurs de tests, compatibilité des données.
