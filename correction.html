@media print{
  :root{color-scheme:light}

  body>:not(.app){display:none!important}
  .app{width:auto;margin:0;padding:0}
  .app>:not(#printReport){display:none!important}
  #printReport{display:block!important}
  .print-header{display:grid;gap:.7mm;margin:0 0 1.5mm;padding:0 0 1mm;border-bottom:1px solid #333}

<script>
const DEFAULT_GRID = {"version": 1, "id": "etude-critique-introduction-conclusion-v1", "titre": "Étude critique — Introduction et conclusion", "niveaux": [{"id": "NA", "libelle": "Non acquis", "valeur": 0, "couleur": "#e45b60"}, {"id": "ECA", "libelle": "En cours d'acquisition", "valeur": 1, "couleur": "#e8c64a"}, {"id": "A", "libelle": "Acquis", "valeur": 2, "couleur": "#49bd7b"}], "elements": [{"id": "introduction-conclusion", "titre": "Introduction et conclusion", "evaluable": true, "commentaires": {"NA": "Début et fin du devoir absents, très limités et/ou maladroits.", "ECA": "Commentaire à préciser à partir de la grille définitive.", "A": "Première et dernière impression très positive : le sujet est compris.", "D": "Commentaire à confirmer à partir de la grille source."}, "enfants": [{"id": "introduction", "titre": "Introduction", "evaluable": true, "commentaires": {}, "enfants": [{"id": "accroche", "titre": "Commencer par une accroche", "evaluable": true, "commentaires": {"NA": "Pas d'accroche.", "ECA": "Accroche présente mais imprécise / déconnectée.", "A": "Accroche efficace et intéressante.", "D": "Accroche et contextualisation s'appuyant sur une culture personnelle."}}, {"id": "definition-termes", "titre": "Définir les termes du sujet", "evaluable": true, "commentaires": {"NA": "Pas de contexte / définitions erronées.", "ECA": "Contextualisation donnant globalement le sens du sujet.", "A": "Bonne maîtrise des notions et enjeux disciplinaires.", "D": "Commentaire à confirmer à partir de la grille source."}}, {"id": "problematique", "titre": "Proposer une problématique", "evaluable": true, "commentaires": {"NA": "Problématique absente ou maladroite, restrictive / menant à un hors-sujet.", "ECA": "Simple reprise du sujet, reformulation sans pertinence mais convenable.", "A": "Questionnement montrant que l'intérêt et la portée du sujet sont bien compris.", "D": "Commentaire à confirmer à partir de la grille source."}}, {"id": "annonce-plan", "titre": "Annoncer le plan", "evaluable": true, "commentaires": {"NA": "Pas d'annonce de plan / annonce très confuse.", "ECA": "Annonce sommaire / plutôt approximative du plan.", "A": "Annonce efficace et qui oriente le devoir.", "D": "Commentaire à confirmer à partir de la grille source."}}]}, {"id": "conclusion", "titre": "Conclusion", "evaluable": true, "commentaires": {}, "enfants": [{"id": "synthese", "titre": "Formuler une synthèse", "evaluable": true, "commentaires": {"NA": "Pas de conclusion.", "ECA": "Phrase conclusive simple / anecdotique / confuse.", "A": "Véritable réponse à la problématique.", "D": "Commentaire à confirmer à partir de la grille source."}}, {"id": "ouverture", "titre": "Proposer une ouverture", "evaluable": true, "commentaires": {"NA": "Pas d'ouverture.", "ECA": "Présence d'une ouverture mais plutôt artificielle.", "A": "Réelle mise en perspective du sujet.", "D": "Commentaire à confirmer à partir de la grille source."}}]}]}], "description": "NA, ECA et A sont des niveaux de maîtrise exclusifs. D est une bonification indépendante : le texte D décrit le motif de valorisation."};
const DEFAULT_CONFIG = {"version": 1, "grille": "etude-critique-introduction-conclusion-v1", "description": "Paramètres de départ à ajuster après essais pédagogiques. D est une bonification indépendante, plafonnée au total indiqué.", "ponderations": {"accroche": 1, "definition-termes": 2, "problematique": 3, "annonce-plan": 2, "synthese": 2, "ouverture": 1}, "seuils": {"NA_max_exclusif": 0.5, "ECA_max_exclusif": 1.5, "A_max_exclusif": 2.5}, "bonus": {"plafond_total": 3, "pas_saisie": 0.25}};
const PART_LAYOUT = [
  {id:"organisation-du-devoir",title:"Organisation du devoir",categories:[{nodeId:"introduction-conclusion",title:"Introduction et conclusion"}]},
  {id:"documents",title:"Documents",categories:[

    {title:"Sélection des informations",description:"Capacités fictives à préciser pour le prototype."}

  {id:"analyse",title:"Analyse",categories:[
    {title:"Compréhension des enjeux",description:"Catégorie fictive à remplacer par les critères définitifs de la grille."},
    {title:"Construction du raisonnement",description:"Capacités fictives à préciser pour le prototype."}

  {id:"forme",title:"Forme",categories:[
    {title:"Expression écrite",description:"Catégorie fictive à remplacer par les critères définitifs de la grille."},

let partLayout = PART_LAYOUT;

let manualChoices = {};

const statusEl = document.getElementById("status");

const partNavEl = document.getElementById("partNav");
let statusTimer;
function setStatus(message, kind=""){
  window.clearTimeout(statusTimer);
  statusEl.textContent=message;statusEl.className=message?"status-toast":"sr-only";statusEl.dataset.kind=kind;
  if(message)statusTimer=window.setTimeout(()=>{statusEl.textContent="";statusEl.className="sr-only";statusEl.dataset.kind=""},kind==="error"?10000:5000);

function allNodes(nodes,result=[]){for(const n of nodes||[]){result.push(n);allNodes(n.enfants,result)}return result}
function isLeaf(n){return !n.enfants||n.enfants.length===0}

function getLeafScore(node){const id=leafChoices[node.id];return id&&levels[id]?{score:levels[id].valeur,weight:getWeight(node),node}:null}
function calculate(node){
  const leaves=descendantsLeaves(node),scored=leaves.map(getLeafScore).filter(Boolean),total=leaves.length,count=scored.length;
  if(!count)return{level:null,mean:null,count,total,partial:total>0};
  const weightedTotal=scored.reduce((s,x)=>s+x.score*x.weight,0),weightTotal=scored.reduce((s,x)=>s+x.weight,0),mean=weightedTotal/weightTotal,t=config.seuils||{};

function effectiveLevel(node){if(isLeaf(node))return leafChoices[node.id]||null;if(Object.hasOwn(manualChoices,node.id))return manualChoices[node.id];return calculate(node).level}
function getCategoryPercentage(node){
  if(Object.hasOwn(manualCategoryPercent,node.id))return manualCategoryPercent[node.id];
  const mean=calculate(node).mean;
  return mean===null?null:mean*50;
}
function categorySliderStops(){
  const stop=value=>Math.min(100,Math.max(0,Number(value)*50));
  const naStop=stop(config.seuils?.NA_max_exclusif??0.5);
  return{na:naStop,eca:Math.max(naStop,stop(config.seuils?.ECA_max_exclusif??1.5))};
}
function chosenOrigin(node){if(isLeaf(node))return leafChoices[node.id]?"manual":"none";if(Object.hasOwn(manualChoices,node.id))return"manual";return calculate(node).level?"auto":"none"}
function totalBonus(){return Object.values(bonusChoices).reduce((s,v)=>s+(Number(v)||0),0)}
function bonusCap(){return Math.max(0,Number(config.bonus?.plafond_total??3))}
function setBonus(node,value){
  const cap=bonusCap(),other=totalBonus()-(Number(bonusChoices[node.id])||0);
  let n=Math.max(0,Number(value)||0);n=Math.min(n,Math.max(0,cap-other));
  bonusChoices[node.id]=Math.round(n*100)/100;
  if(bonusChoices[node.id]===0)delete bonusChoices[node.id];
}
function makeChoiceButton(node, level, selected, commentText, isBonus=false){
  const b=document.createElement("button");b.type="button";b.className="choice-btn";b.style.setProperty("--level-color",level.couleur);
  if(selected)b.classList.add("active");
  b.textContent=commentText || level.libelle;
  b.setAttribute("aria-pressed",String(Boolean(selected)));
  b.addEventListener("click",()=>{
    if(isBonus){
      if(bonusChoices[node.id])delete bonusChoices[node.id];
      else setBonus(node,Math.min(0.5,Math.max(0,bonusCap()-totalBonus())));
      render();
      return;
    }
    if(leafChoices[node.id]===level.id)delete leafChoices[node.id];

    render();
  });
  return b;
}
function makeLevelButton(node,level,effective,origin,suggested,isBonus=false){
  const b=document.createElement("button");b.type="button";b.className="level-btn";b.style.setProperty("--level-color",level.couleur);
  if(isBonus){b.classList.add("d-bonus");if(bonusChoices[node.id])b.classList.add("active")}
  if(suggested===level.id)b.classList.add("suggested");
  if(origin==="manual"&&effective===level.id)b.classList.add("manual");
  if(effective===level.id)b.classList.add("final-selected");
  b.setAttribute("aria-pressed",String(effective===level.id));
  b.innerHTML=`<span class="abbr">${level.id}</span><span class="full">${level.id === "D" ? "Bonus" : level.libelle}</span>`;
  b.addEventListener("click",()=>{
    if(isBonus){
      if(bonusChoices[node.id])delete bonusChoices[node.id];
      else setBonus(node,Math.min(0.5,Math.max(0,bonusCap()-totalBonus())));
      render();
      return;
    }
    if(isLeaf(node)){leafChoices[node.id]=leafChoices[node.id]===level.id?null:level.id}
    else if(Object.hasOwn(manualChoices,node.id)&&manualChoices[node.id]===level.id){delete manualChoices[node.id]}

function renderNode(node,depth=0,hideTitle=false){
  const wrap=document.createElement("section");wrap.className=`node ${isLeaf(node)?"leaf":"group"} depth-${Math.min(depth,3)}`;
  const eff=effectiveLevel(node),origin=chosenOrigin(node),calc=isLeaf(node)?null:calculate(node);
  const nameBlock=document.createElement("div");nameBlock.className="capacity-name";
  const nameText=document.createElement("div");nameText.className="node-title";nameText.textContent=node.titre;
  const weightText=document.createElement("div");weightText.className="weight";weightText.textContent=`poids:${getWeight(node)}`;
  nameBlock.appendChild(nameText);nameBlock.appendChild(weightText);
  const criterionRow=document.createElement("div");criterionRow.className="criterion-row";
  if(hideTitle)criterionRow.classList.add("category-summary");
  if(!hideTitle)criterionRow.appendChild(nameBlock);

  if(!isLeaf(node) && depth > 0){
    wrap.appendChild(criterionRow);
    const children=document.createElement("div");children.className="children";
    for(const child of node.enfants)children.appendChild(renderNode(child,depth+1));
    wrap.appendChild(children);
    return wrap;
  }

  if(!isLeaf(node) && depth === 0){
    const children=document.createElement("div");children.className="children";
    for(const child of node.enfants)children.appendChild(renderNode(child,depth+1));
    wrap.appendChild(children);
    return wrap;
  }

  const selectionWrap=document.createElement("div");selectionWrap.className="capacity-choices";
  const choices=[...grid.niveaux,{id:"D",libelle:"Bonus",couleur:"#55a7ee"}];
  for(const l of choices){
    const isBonus = l.id === "D";
    const commentText = isBonus ? (node.commentaires?.D || "Commentaire à confirmer à partir de la grille source.") : (node.commentaires?.[l.id] || l.libelle);
    const selected = isBonus ? Boolean(bonusChoices[node.id]) : eff === l.id;

}
function initializePartNav(){
  partNavEl.innerHTML="";
  for(const part of partLayout){
    const button=document.createElement("button");button.type="button";button.className="part-tab";
    button.setAttribute("aria-controls",`part-${part.id}`);button.setAttribute("aria-label",part.title);
    const count=document.createElement("span");count.className="part-tab-count";count.textContent="0/0";button.appendChild(count);
    const label=document.createElement("span");label.className="part-tab-label";label.textContent=part.title;button.appendChild(label);
    button.addEventListener("click",()=>{
      const section=document.getElementById(`part-${part.id}`);

function setActivePart(id){

    else button.removeAttribute("aria-current");

function updateActivePart(){

    if(section&&section.getBoundingClientRect().top<=marker)active=part.id;

function updatePartCounts(roots){
  const mappedIds=new Set(partLayout.flatMap(part=>part.categories.filter(category=>category.nodeId).map(category=>category.nodeId)));
  for(const part of partLayout){
    const nodes=part.categories.map(category=>roots.find(root=>root.id===category.nodeId)).filter(Boolean);
    if(part.id===partLayout[0].id)nodes.push(...roots.filter(root=>!mappedIds.has(root.id)));

function updateCategoryEvaluation(nodeId,key,value){
  const next={warning:false,exceeded:false,motifId:"",...categoryEvaluations[nodeId],[key]:value};
  if(!next.warning&&!next.exceeded&&!next.motifId)delete categoryEvaluations[nodeId];
  else categoryEvaluations[nodeId]=next;

function makeCategoryToggle(node,labelText,key){
  const label=document.createElement("label"),input=document.createElement("input");input.type="checkbox";input.checked=Boolean(categoryEvaluations[node.id]?.[key]);
  input.setAttribute("aria-label",labelText);input.addEventListener("change",()=>updateCategoryEvaluation(node.id,key,input.checked));

  if(options.warning)controls.appendChild(makeCategoryToggle(node,"Avertissement","warning"));
  if(options.exceeded)controls.appendChild(makeCategoryToggle(node,"Dépassé (D)","exceeded"));
  if(motifs.length){
    const label=document.createElement("label"),select=document.createElement("select");select.setAttribute("aria-label",`Commentaire général pour ${node.titre}`);

    select.value=categoryEvaluations[node.id]?.motifId||"";select.addEventListener("change",()=>updateCategoryEvaluation(node.id,"motifId",select.value));label.appendChild(select);controls.appendChild(label);
  }

function renderCategory(category,node=null){

    const colors={NA:"#e45b60",ECA:"#e8c64a",A:"#49bd7b"};
    for(const id of Object.keys(colors))colors[id]=grid.niveaux.find(level=>level.id===id)?.couleur||colors[id];
    const stops=categorySliderStops();
    slider.style.setProperty("--na-color",colors.NA);slider.style.setProperty("--eca-color",colors.ECA);slider.style.setProperty("--a-color",colors.A);

    const percentage=getCategoryPercentage(node);
    const mean=document.createElement("span");mean.className="pill category-percentage";metrics.appendChild(mean);
    const coefficient=document.createElement("span");coefficient.className="pill";coefficient.textContent=`Coeff. catégorie : ${getCategoryCoefficient(node)}`;metrics.appendChild(coefficient);

    });

    slider.addEventListener("pointerup",event=>{

function detectCsvDelimiter(text){
  const firstLine=text.split(/\r\n|\n|\r/,1)[0]||"";let quoted=false,commas=0,semicolons=0;
  for(let index=0;index<firstLine.length;index++){
    const character=firstLine[index];
    if(character==='"'){
      if(quoted&&firstLine[index+1]==='"'){index++;continue}
      quoted=!quoted;
    }else if(!quoted&&character===",")commas++;
    else if(!quoted&&character===";")semicolons++;
  }
  return semicolons>commas?";":",";
}
function parseCsv(text){

    const character=source[index];

      if(character==='"'){
        if(source[index+1]==='"'){field+='"';index++}
        else quoted=false;
      }else field+=character;
    }else if(character==='"'&&field.length===0)quoted=true;
    else if(character===delimiter){row.push(field);field=""}

      if(character==="\r"&&source[index+1]==="\n")index++;
      row.push(field);if(row.some(value=>value.trim()!==""))rows.push(row);row=[];field="";
    }else field+=character;
  }
  if(quoted)throw new Error("un guillemet CSV n'est pas refermé.");
  if(field.length||row.length){row.push(field);if(row.some(value=>value.trim()!==""))rows.push(row)}
  if(rows.length<2)throw new Error("le fichier ne contient aucune donnée.");
  const headers=rows.shift().map(value=>value.trim());
  if(new Set(headers).size!==headers.length)throw new Error("les noms de colonnes doivent être uniques.");
  const required=["type","partie","categorie","sous_categorie","id","titre","evaluable","commentaire_NA","commentaire_ECA","commentaire_A","commentaire_D","ponderation","parametre","valeur","coefficient_categorie"];
  const missing=required.filter(header=>!headers.includes(header));
  if(missing.length)throw new Error(`colonnes manquantes : ${missing.join(", ")}.`);
  return rows.map((values,index)=>{
    if(values.length>headers.length)throw new Error(`la ligne ${index+2} contient trop de colonnes.`);
    return Object.fromEntries(headers.map((header,column)=>[header,(values[column]||"").trim()]));
  });
}
function csvNumber(value,label){

function csvBoolean(value,label){

function activateLoadedGrid(title){document.getElementById("pageTitle").textContent=title;document.querySelector(".app").classList.add("grid-loaded");initializePartNav()}
function applyCsvText(text,fileName){
  const loaded=gridFromCsv(text,fileName);grid=loaded.grid;config=loaded.config;partLayout=loaded.partLayout;levels=Object.fromEntries(grid.niveaux.map(level=>[level.id,level]));
  activateLoadedGrid(grid.titre);resetChoices();render();setStatus(`Grille CSV « ${fileName} » chargée. Les choix précédents ont été réinitialisés.`);
}
async function loadRepositoryGrid(entry,button){
  button.disabled=true;setStatus(`Chargement de la grille « ${entry.titre} »…`);
  try{
    const url=new URL(entry.fichier,document.baseURI);
    if(url.origin!==location.origin)throw new Error("le fichier doit être hébergé sur le même site.");
    const response=await fetch(url,{cache:"no-store"});
    if(!response.ok)throw new Error(`réponse HTTP ${response.status}.`);
    applyCsvText(await response.text(),entry.fichier);
  }catch(error){setStatus(`Impossible de charger « ${entry.titre} » : ${error.message}`,"error")}
  finally{button.disabled=false;document.getElementById("importMenu").open=false}
}
async function loadGridCatalog(){
  const catalogEl=document.getElementById("gridCatalog");
  try{
    const response=await fetch(new URL("grilles.json",document.baseURI),{cache:"no-cache"});
    if(!response.ok)throw new Error(`réponse HTTP ${response.status}.`);
    const catalog=await response.json();
    if(!Array.isArray(catalog.grilles)||!catalog.grilles.length)throw new Error("aucune grille n'est déclarée.");
    const buttons=catalog.grilles.map(entry=>{
      if(!entry||typeof entry.titre!=="string"||typeof entry.fichier!=="string"||!entry.fichier.toLowerCase().endsWith(".csv"))throw new Error("une entrée du catalogue est invalide.");
      const button=document.createElement("button");button.type="button";button.className="import-option import-catalog-button";button.textContent=entry.titre;
      button.addEventListener("click",()=>loadRepositoryGrid(entry,button));return button;
    });
    catalogEl.replaceChildren(...buttons);
  }catch(error){catalogEl.textContent="Catalogue indisponible.";setStatus(`Impossible de charger le catalogue des grilles : ${error.message}`,"error")}
}
function readCsvFile(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{applyCsvText(String(reader.result||""),file.name)}catch(error){setStatus("CSV invalide : "+error.message,"error")}
  };
  reader.onerror=()=>setStatus("La lecture du fichier CSV a échoué.","error");reader.readAsText(file,"UTF-8");
}
document.getElementById("gridCsvInput").addEventListener("change",event=>{const file=event.target.files?.[0];event.target.value="";document.getElementById("importMenu").open=false;if(file)readCsvFile(file)});
document.getElementById("gridInput").addEventListener("change",event=>{const file=event.target.files?.[0];event.target.value="";document.getElementById("importMenu").open=false;if(!file)return;readJsonFile(file,data=>{if(!data.elements||!data.niveaux){setStatus("Ce fichier ne ressemble pas à une définition de grille valide.","error");return}grid=data;partLayout=PART_LAYOUT;levels=Object.fromEntries(grid.niveaux.map(level=>[level.id,level]));activateLoadedGrid(grid.titre||"Grille de correction");resetChoices();render();setStatus("Grille JSON chargée. Les choix précédents ont été réinitialisés.")})});
document.getElementById("configInput").addEventListener("change",event=>{const file=event.target.files?.[0];event.target.value="";document.getElementById("importMenu").open=false;if(!file)return;readJsonFile(file,data=>{if(!data.ponderations||!data.seuils){setStatus("Paramétrage invalide : pondérations ou seuils absents.","error");return}config=data;const cap=bonusCap();let left=cap;for(const id of Object.keys(bonusChoices)){const value=Math.min(bonusChoices[id],left);bonusChoices[id]=value;left-=value;if(value<=0)delete bonusChoices[id]}render();setStatus("Paramétrage JSON chargé. Pondérations, seuils et plafond de bonus actualisés.")})});
document.getElementById("printBtn").addEventListener("click",()=>window.print());
document.getElementById("resetBtn").addEventListener("click",()=>{resetChoices();render();setStatus("Tous les choix et bonus ont été réinitialisés.")});
document.getElementById("settingsBtn").addEventListener("click",()=>document.getElementById("settingsDialog").showModal());
document.getElementById("closeSettings").addEventListener("click",()=>document.getElementById("settingsDialog").close());
document.getElementById("showMetrics").addEventListener("change",event=>document.querySelector(".app").classList.toggle("show-metrics",event.target.checked));
window.addEventListener("beforeprint",renderPrintReport);
window.addEventListener("afterprint",()=>document.getElementById("printReport").replaceChildren());
window.addEventListener("beforeunload",event=>{
  if(!document.querySelector(".app").classList.contains("grid-loaded"))return;
  event.preventDefault();
  event.returnValue="";
});
window.addEventListener("scroll",updateActivePart,{passive:true});
loadGridCatalog();
</script>
</body></html>
