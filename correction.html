<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moteur de correction</title>
  <style>
    :root {
      --bg: #171b1f;
      --panel: #1f252b;
      --panel-strong: #28313a;
      --border: #3b4650;
      --text: #edf2f7;
      --muted: #a5b1bc;
      --accent: #71b7ff;
      --success: #4fc983;
      --warning: #f7c76a;
      --danger: #ed6d6d;
      --shadow: rgba(0,0,0,.28);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.45 system-ui, -apple-system, Segoe UI, sans-serif;
    }
    body { padding: 24px; }
    .app {
      width: min(1100px, 100%);
      margin: 0 auto;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      padding: 12px 18px;
      background: rgba(23,27,31,.95);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 8px 20px var(--shadow);
      backdrop-filter: blur(8px);
    }
    .title-wrap { min-width: 0; }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.2rem, 2vw, 1.7rem);
    }
    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .field {
      display: flex;
      flex-direction: column;
      min-width: 0;
      gap: 4px;
    }
    .field label {
      color: var(--muted);
      font-size: .76rem;
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    input[type="text"], select, button {
      font: inherit;
    }
    input[type="text"] {
      width: min(360px, 100%);
      background: #11171b;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 10px;
    }
    .grade-box {
      width: 160px;
    }
    .icon-button, .import-option, .action-button {
      border: 1px solid var(--border);
      background: var(--panel-strong);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
    }
    .import-menu {
      position: relative;
    }
    .import-options {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      min-width: 260px;
      display: none;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 12px 24px var(--shadow);
      padding: 8px;
      z-index: 30;
    }
    .import-menu[open] .import-options { display: block; }
    .import-option {
      display: block;
      width: 100%;
      text-align: left;
      margin: 4px 0;
    }
    .import-heading {
      font-size: .7rem;
      color: var(--muted);
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 6px 8px 0;
    }
    #status {
      margin-top: 14px;
      min-height: 24px;
      color: var(--muted);
      font-size: .9rem;
    }
    .status-error { color: var(--danger); }
    .status-success { color: var(--success); }
    .part-section {
      margin-top: 20px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      background: rgba(255,255,255,.01);
    }
    .part-heading {
      margin: 0 0 12px;
      font-size: 1.25rem;
      color: #dfe7ef;
    }
    .section {
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-top: 12px;
      overflow: hidden;
      background: rgba(255,255,255,.01);
    }
    .section-head {
      background: rgba(255,255,255,.02);
      border-bottom: 1px solid var(--border);
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }
    .section-head h2 {
      margin: 0;
      font-size: 1.05rem;
    }
    .category-levels {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .level-btn {
      border: 1px solid var(--border);
      background: #2b343d;
      color: var(--text);
      border-radius: 6px;
      padding: 5px 8px;
      min-width: 42px;
      cursor: pointer;
      font-weight: 700;
    }
    .level-btn.active {
      background: var(--accent);
      color: #0d1821;
      border-color: var(--accent);
    }
    .category-metrics {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin: 8px 0;
      color: var(--muted);
      font-size: .8rem;
    }
    .category-comment {
      padding: 0 12px 12px;
      color: var(--muted);
      font-size: .9rem;
    }
    .children {
      padding: 0 12px 12px;
    }
    .node {
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .node:first-child { border-top: 0; }
    .criterion-row {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 2fr);
      gap: 12px;
      align-items: center;
    }
    .capacity-name {
      font-weight: 600;
    }
    .weight {
      font-size: .72rem;
      color: var(--muted);
    }
    .capacity-choices {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }
    .choice-btn {
      border: 1px solid var(--border);
      background: #2d3740;
      border-radius: 8px;
      color: var(--text);
      min-height: 54px;
      cursor: pointer;
      padding: 8px 10px;
      text-align: left;
      line-height: 1.2;
    }
    .choice-btn.active {
      border-color: var(--accent);
      background: rgba(113,183,255,.18);
    }
    .choice-btn[data-level="NA"].active { background: rgba(237,109,109,.2); border-color: var(--danger); }
    .choice-btn[data-level="ECA"].active { background: rgba(247,199,106,.18); border-color: var(--warning); }
    .choice-btn[data-level="A"].active { background: rgba(79,201,131,.18); border-color: var(--success); }
    .choice-btn[data-level="D"].active { background: rgba(113,183,255,.2); border-color: var(--accent); }
    .empty-state {
      color: var(--muted);
      padding: 16px 8px;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
    @media (max-width: 720px) {
      body { padding: 16px; }
      header { grid-template-columns: 1fr; }
      .toolbar { justify-content: flex-start; }
      .criterion-row { grid-template-columns: 1fr; }
      .capacity-choices { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    :root {
      color-scheme: dark;
      --bg: #242629;
      --panel: #2d3034;
      --panel-strong: #3a3d42;
      --border: #50545a;
      --text: #f3f4f5;
      --muted: #aeb3b9;
      --accent: #55a7ee;
      --header-height: 128px;
    }
    html { background: var(--bg); scrollbar-gutter: stable; }
    body { padding: 0; background: var(--bg); }
    .app {
      width: min(1080px, 100%);
      margin: 0 auto;
      padding: calc(var(--header-height) + 20px) 16px 20px 96px;
    }
    header {
      position: fixed;
      inset: 0 0 auto;
      height: var(--header-height);
      grid-template-columns: minmax(0, 5fr) minmax(170px, 3fr);
      align-items: center;
      gap: 12px;
      padding: 10px max(18px, calc((100vw - 1080px) / 2));
      border: 0;
      border-bottom: 1px solid var(--border);
      border-radius: 0;
      background: rgba(36, 38, 41, .98);
      box-shadow: none;
      backdrop-filter: none;
    }
    .header-left { min-width: 0; }
    .header-left h1 { margin: 0 0 7px; font-size: 1.2rem; line-height: 1.15; }
    .header-fields { display: grid; grid-template-columns: minmax(0, 360px); gap: 5px; }
    .student-name { width: 100%; height: 34px; padding: 6px 10px; border-radius: 6px; font-size: .9rem; }
    .grade-line { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .grade-line .final-grade { flex: 0 1 180px; width: min(50%, 180px); min-width: 0; }
    .header-score { flex: none; color: var(--muted); font-size: 1rem; font-weight: 600; white-space: nowrap; }
    .header-actions { display: grid; grid-template-columns: repeat(4, 44px); justify-content: end; gap: 8px; }
    .icon-button, .header-actions > button {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid #5a5e64;
      border-radius: 7px;
      background: #34373b;
      color: var(--text);
      font-size: .7rem;
      text-align: center;
    }
    .icon-button:hover, .header-actions > button:hover { background: #4a4e54; }
    .import-menu > summary { list-style: none; cursor: pointer; }
    .import-menu > summary::-webkit-details-marker { display: none; }
    .import-options { top: calc(100% + 6px); min-width: 210px; padding: 4px; border-radius: 6px; }
    .import-option { border: 0; border-radius: 4px; background: transparent; font-size: .85rem; }
    .import-option:hover { background: #4a4e54; }
    #status {
      position: fixed;
      z-index: 30;
      top: calc(var(--header-height) + 8px);
      left: 50%;
      max-width: calc(100vw - 24px);
      padding: 8px 12px;
      transform: translateX(-50%);
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel);
      box-shadow: 0 4px 16px rgba(0, 0, 0, .35);
    }
    #status:empty { display: none; }
    .status-error { border-color: var(--danger) !important; }
    .part-nav {
      position: fixed;
      z-index: 10;
      top: var(--header-height);
      bottom: 0;
      left: max(0px, calc((100vw - 1080px) / 2));
      display: flex;
      width: 64px;
      flex-direction: column;
      overflow-y: auto;
      border-right: 1px solid var(--border);
      background: #292c30;
    }
    .part-tab {
      position: relative;
      display: block;
      flex: 1 0 25%;
      min-height: 100px;
      width: 100%;
      padding: 0;
      border: 0;
      border-bottom: 1px solid #55595f;
      border-radius: 0;
      background: #3a3d42;
      color: #fff;
      font-size: .88rem;
      font-weight: 650;
      line-height: 1.05;
      overflow: hidden;
      cursor: pointer;
    }
    .part-tab:hover { background: #4a4e54; }
    .part-tab[aria-current="location"] { background: #fff; color: #17191c; }
    .part-tab.complete::before { position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--accent); content: ""; }
    .part-tab-label { position: absolute; top: 59%; left: 50%; width: max(56px, calc(20.83vh - 20px)); padding: 0 2px; transform: translate(-50%, -50%) rotate(-90deg); overflow-wrap: anywhere; text-align: center; }
    .part-tab-count { position: absolute; z-index: 1; top: 6px; left: 50%; min-width: 34px; padding: 4px 6px; transform: translateX(-50%); border-radius: 999px; background: #55595f; color: #fff; font-size: .66rem; line-height: 1; white-space: nowrap; }
    .part-tab.complete .part-tab-count { background: var(--accent); color: #111; }
    .part-section { scroll-margin-top: calc(var(--header-height) + 12px); margin: 0 0 28px; }
    .part-heading { margin: 0 0 16px; padding: 0 0 10px; border-bottom: 1px solid var(--border); color: #858a90; font-size: 1.55rem; font-weight: 800; line-height: 1.2; }
    .section { margin: 18px 0; border-radius: 10px; background: transparent; }
    .section-head { padding: 8px 10px; background: var(--panel); }
    .section-head h2 { font-size: 1.18rem; }
    .category-metrics { min-height: 26px; margin: 3px 0 0; }
    .category-comment { min-height: 2.5rem; padding: 4px 10px; background: #292c30; font-size: .85rem; }
    .children { margin-top: 4px; padding: 0 10px 8px; }
    .node { padding: 8px 0; border-color: #3c3f44; }
    .node .criterion-row { grid-template-columns: minmax(115px, .72fr) minmax(0, 3.28fr); gap: 8px; align-items: start; }
    .capacity-name { font-size: .88rem; line-height: 1.15; }
    .weight { display: none; }
    .capacity-choices { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
    .choice-btn { min-height: 48px; padding: 7px; border-radius: 6px; font-size: .78rem; line-height: 1.2; }
    .empty-state { padding: 20px; color: var(--muted); }
    @media (max-width: 720px) {
      :root { --header-height: 112px; }
      .app { padding: calc(var(--header-height) + 14px) 10px 16px 76px; }
      header { grid-template-columns: minmax(0, 5fr) minmax(104px, 3fr); gap: 5px; padding: 8px; }
      .header-left h1 { font-size: 1rem; }
      .student-name { height: 30px; padding: 4px 6px; font-size: .78rem; }
      .header-fields { gap: 3px; }
      .grade-line { gap: 6px; }
      .grade-line .final-grade { flex-basis: 50%; width: 50%; }
      .header-score { font-size: .85rem; }
      .header-actions { grid-template-columns: repeat(3, 34px); gap: 4px; }
      .icon-button, .header-actions > button { width: 34px; height: 34px; border-radius: 6px; font-size: .58rem; }
      .part-nav { width: 56px; }
      .part-tab { min-height: 80px; font-size: .78rem; }
      .part-tab-label { width: max(48px, calc(20vh - 12px)); font-size: .74rem; }
      .part-tab-count { top: 5px; min-width: 32px; padding: 3px 5px; font-size: .6rem; }
      .node .criterion-row { grid-template-columns: minmax(0, 1fr); }
      .capacity-choices { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media print {
      :root { color-scheme: light; }
      html, body { background: #fff !important; color: #111 !important; }
      .part-nav, header, #status { display: none !important; }
      .app { width: auto; margin: 0; padding: 0; }
      .part-section { margin: 0 0 12px; }
      .part-heading { color: #555; }
      .section, .section-head, .category-comment { background: #fff !important; color: #111 !important; }
      .part-tab, button { print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <div class="app">
    <nav class="part-nav" id="partNav" aria-label="Navigation des parties"></nav>
    <header>
      <div class="header-left">
        <h1 id="pageTitle">Chargement de la grille…</h1>
        <div class="header-fields">
          <input id="studentName" class="student-name" type="text" placeholder="Nom de l'élève" aria-label="Nom de l'élève">
          <div class="grade-line">
            <input id="finalGrade" class="student-name final-grade" type="text" placeholder="Note finale" aria-label="Note finale">
            <div class="header-score" aria-label="Note calculée"><output id="finalScore">—/20</output></div>
          </div>
        </div>
      </div>
      <div class="header-actions" aria-label="Actions">

        <details class="import-menu" id="importMenu">
          <summary class="icon-button" title="Choisir une grille" aria-label="Choisir une grille">CSV</summary>
          <div class="import-options">
            <div class="import-heading">Catalogue</div>
            <div id="gridCatalog"></div>
          </div>
        </details>
        <button id="resetBtn" type="button" title="Réinitialiser" aria-label="Réinitialiser">Effacer</button>
        <button id="printBtn" type="button" title="Imprimer" aria-label="Imprimer">PDF</button>
      </div>
    </header>

    <div id="status" aria-live="polite"></div>
    <main id="content"></main>
  </div>

  <script>
    const DEFAULT_LEVELS = [
      { id: 'NA', libelle: 'Non acquis', couleur: '#ed6d6d', valeur: 0 },
      { id: 'ECA', libelle: 'En cours d’acquisition', couleur: '#f7c76a', valeur: 1 },
      { id: 'A', libelle: 'Acquis', couleur: '#4fc983', valeur: 2 },
      { id: 'D', libelle: 'Dépassé', couleur: '#71b7ff', valeur: 3 }
    ];

    let partLayout = [];
    let grid = { version: 1, id: '', titre: '', niveaux: DEFAULT_LEVELS, elements: [] };
    let config = { seuils: {}, bonus: {}, ponderations: {}, coefficientsCategories: {} };
    let leafChoices = {};
    let bonusChoices = {};
    let manualCategoryPercent = {};
    let manualChoices = {};
    let categoryEvaluations = {};
    let levels = Object.fromEntries(DEFAULT_LEVELS.map(level => [level.id, level]));

    const contentEl = document.getElementById('content');
    const statusEl = document.getElementById('status');
    const pageTitleEl = document.getElementById('pageTitle');
    const finalScoreEl = document.getElementById('finalScore');

    function setStatus(message, kind = '') {
      statusEl.textContent = message || '';
      statusEl.className = message ? (kind === 'error' ? 'status-error' : 'status-success') : '';
    }

    function normalizeType(value) {
      return String(value || '').trim().toLowerCase();
    }

    function isLeaf(node) {
      return !node || !Array.isArray(node.enfants) || node.enfants.length === 0;
    }

    function descendantsLeaves(node) {
      if (!node) return [];
      if (isLeaf(node)) return [node];
      return (node.enfants || []).flatMap(descendantsLeaves);
    }

    function getWeight(node) {
      const value = config.ponderations?.[node.id];
      return Number.isFinite(Number(value)) && Number(value) > 0 ? Number(value) : 1;
    }

    function getCategoryCoefficient(node) {
      const value = config.coefficientsCategories?.[node.id];
      return Number.isFinite(Number(value)) && Number(value) > 0 ? Number(value) : 1;
    }

    function getLeafScore(node) {
      const id = leafChoices[node.id];
      const level = id && levels[id];
      if (!level) return null;
      return { score: level.valeur, weight: getWeight(node), node };
    }

    function calculate(node) {
      const leaves = descendantsLeaves(node);
      const scored = leaves.map(getLeafScore).filter(Boolean);
      const total = leaves.length;
      if (!scored.length) return { level: null, mean: null, count: 0, total, partial: total > 0 };

      const weightedTotal = scored.reduce((sum, item) => sum + item.score * item.weight, 0);
      const weightTotal = scored.reduce((sum, item) => sum + item.weight, 0);
      const mean = weightedTotal / weightTotal;
      const thresholds = config.seuils || {};

      let level = 'A';
      if (mean < Number(thresholds.NA_max_exclusif ?? 0.5)) level = 'NA';
      else if (mean < Number(thresholds.ECA_max_exclusif ?? 1.5)) level = 'ECA';

      return { level, mean, count: scored.length, total, partial: scored.length < total };
    }

    function effectiveLevel(node) {
      if (isLeaf(node)) return leafChoices[node.id] || null;
      if (Object.hasOwn(manualChoices, node.id)) return manualChoices[node.id];
      return calculate(node).level;
    }

    function getCategoryPercentage(node) {
      if (Object.hasOwn(manualCategoryPercent, node.id)) return manualCategoryPercent[node.id];
      const mean = calculate(node).mean;
      return mean === null ? null : mean * 50;
    }

    function totalBonus() {
      return Object.values(bonusChoices).reduce((sum, item) => sum + Number(item || 0), 0);
    }

    function calculateFinalScore() {
      const categoryScores = (grid.elements || []).map(category => {
        const percentage = getCategoryPercentage(category);
        if (percentage === null) return null;
        return { percentage, coefficient: getCategoryCoefficient(category) };
      }).filter(Boolean);

      if (!categoryScores.length) return null;
      const coefficientTotal = categoryScores.reduce((sum, item) => sum + item.coefficient, 0);
      const weightedPercent = categoryScores.reduce((sum, item) => sum + item.percentage * item.coefficient, 0);
      return Math.min(20, 20 * (weightedPercent / (100 * coefficientTotal)) + totalBonus());
    }

    function updateFinalScore() {
      const score = calculateFinalScore();
      finalScoreEl.textContent = score === null ? '—/20' : `${score.toFixed(2).replace('.', ',')}/20`;
    }

    function detectCsvDelimiter(text) {
      const firstLine = (text.split(/\r\n|\n|\r/, 1)[0] || '');
      let quoted = false;
      let commas = 0;
      let semicolons = 0;
      for (let i = 0; i < firstLine.length; i++) {
        const char = firstLine[i];
        if (char === '"') {
          if (quoted && firstLine[i + 1] === '"') { i++; continue; }
          quoted = !quoted;
        } else if (!quoted) {
          if (char === ',') commas++;
          if (char === ';') semicolons++;
        }
      }
      return semicolons > commas ? ';' : ',';
    }

    function parseCsv(text) {
      const source = String(text || '').replace(/^\uFEFF/, '');
      const delimiter = detectCsvDelimiter(source);
      const rows = [];
      let row = [];
      let field = '';
      let quoted = false;

      for (let i = 0; i < source.length; i++) {
        const char = source[i];
        if (quoted) {
          if (char === '"') {
            if (source[i + 1] === '"') {
              field += '"';
              i++;
            } else {
              quoted = false;
            }
          } else {
            field += char;
          }
          continue;
        }

        if (char === '"') {
          if (field.length === 0) quoted = true;
          else field += char;
          continue;
        }

        if (char === delimiter) {
          row.push(field);
          field = '';
          continue;
        }

        if (char === '\n' || char === '\r') {
          if (char === '\r' && source[i + 1] === '\n') i++;
          row.push(field);
          if (row.some(value => value.trim() !== '')) rows.push(row);
          row = [];
          field = '';
          continue;
        }

        field += char;
      }

      if (quoted) throw new Error('Guillemet CSV non fermé.');
      if (field.length || row.length) {
        row.push(field);
        if (row.some(value => value.trim() !== '')) rows.push(row);
      }

      if (rows.length < 2) throw new Error('Le fichier CSV est vide ou incomplet.');

      const headers = rows.shift().map(value => value.trim());
      if (new Set(headers).size !== headers.length) throw new Error('Les colonnes du CSV ne sont pas uniques.');

      const required = [
        'type', 'partie', 'categorie', 'id', 'sous_categorie', 'titre', 'evaluable',
        'commentaire_NA', 'commentaire_ECA', 'commentaire_A', 'commentaire_D',
        'ponderation', 'parametre', 'valeur', 'coefficient_categorie', 'categorie_id'
      ];

      const missing = required.filter(header => !headers.includes(header));
      if (missing.length) throw new Error(`Colonnes manquantes : ${missing.join(', ')}.`);

      return rows.map((values, index) => {
        if (values.length > headers.length) {
          throw new Error(`La ligne ${index + 2} contient trop de colonnes.`);
        }
        const obj = {};
        headers.forEach((header, column) => {
          obj[header] = (values[column] || '').trim();
        });
        return obj;
      });
    }

    function csvNumber(value, label) {
      const n = Number(String(value).trim().replace(',', '.'));
      if (!Number.isFinite(n)) throw new Error(`${label} doit être un nombre.`);
      return n;
    }

    function gridFromCsv(text, fileName) {
      const records = parseCsv(text);
      const parts = new Map();
      const categories = new Map();
      const subcategories = new Map();
      const categoryDefinitions = new Map();
      const categoryById = new Map();
      const capacityIds = new Set();
      const categoryKeys = new Set();
      const elements = [];
      const configData = {
        seuils: {},
        bonus: {},
        ponderations: {},
        coefficientsCategories: {}
      };

      for (const record of records) {
        const type = normalizeType(record.type);
        if (type === 'categorie') {
          const partTitle = String(record.partie || '').trim();
          const categoryTitle = String(record.categorie || '').trim();
          const id = String(record.id || '').trim();
          if (!partTitle || !categoryTitle || !id) {
            throw new Error(`Définition de catégorie invalide : ${JSON.stringify(record)}`);
          }
          const key = JSON.stringify([partTitle, categoryTitle]);
          if (categoryKeys.has(key)) {
            throw new Error(`La catégorie « ${categoryTitle} » est définie plusieurs fois.`);
          }
          categoryKeys.add(key);
          categoryDefinitions.set(key, { id, partTitle, categoryTitle, coefficient: record.coefficient_categorie ? csvNumber(record.coefficient_categorie, `Coefficient de ${categoryTitle}`) : null });
          categoryById.set(id, { id, partTitle, categoryTitle });
        }
      }

      for (const record of records) {
        const type = normalizeType(record.type);
        if (type === 'capacite') {
          const capacityId = String(record.id || '').trim();
          const title = String(record.titre || '').trim();
          const categoryId = String(record.categorie_id || '').trim();
          if (!capacityId || !title) throw new Error(`Capacité invalide : ${JSON.stringify(record)}`);
          if (capacityIds.has(capacityId)) throw new Error(`Capacité dupliquée : ${capacityId}`);
          capacityIds.add(capacityId);

          const def = categoryId ? categoryById.get(categoryId) : null;
          const partTitle = def?.partTitle || String(record.partie || '').trim();
          const categoryTitle = def?.categoryTitle || String(record.categorie || '').trim();
          const subcategoryTitle = String(record.sous_categorie || '').trim() === '_' ? '' : String(record.sous_categorie || '').trim();

          if (!partTitle || !categoryTitle) throw new Error(`Capacité sans partie ou catégorie : ${title}`);

          let part = parts.get(partTitle);
          if (!part) {
            part = { id: `part-${parts.size + 1}`, title: partTitle, categories: [] };
            parts.set(partTitle, part);
          }

          const categoryKey = JSON.stringify([partTitle, categoryTitle]);
          let category = categories.get(categoryKey);
          if (!category) {
            const defData = categoryDefinitions.get(categoryKey);
            category = {
              id: defData?.id || `category-${categories.size + 1}`,
              titre: categoryTitle,
              enfants: [],
              commentMotifs: []
            };
            categories.set(categoryKey, category);
            elements.push(category);
            part.categories.push({ nodeId: category.id, title: categoryTitle });
            if (defData && defData.coefficient !== null) configData.coefficientsCategories[category.id] = defData.coefficient;
          }

          if (record.coefficient_categorie) {
            const coefficient = csvNumber(record.coefficient_categorie, `Coefficient de ${categoryTitle}`);
            configData.coefficientsCategories[category.id] = coefficient;
          }

          let parent = category;
          if (subcategoryTitle) {
            const subKey = JSON.stringify([partTitle, categoryTitle, subcategoryTitle]);
            let sub = subcategories.get(subKey);
            if (!sub) {
              sub = { id: `sub-${subcategories.size + 1}`, titre: subcategoryTitle, enfants: [] };
              subcategories.set(subKey, sub);
              category.enfants.push(sub);
            }
            parent = sub;
          }

          const evaluable = String(record.evaluable || '').trim().toLowerCase();
          if (!['true', '1', 'oui', 'vrai'].includes(evaluable)) {
            throw new Error(`La capacité « ${title} » n'est pas évaluable.`);
          }

          const weight = csvNumber(record.ponderation, `Pondération de ${title}`);
          if (weight <= 0) throw new Error(`La pondération de ${title} doit être > 0.`);

          const comment = {
            NA: record.commentaire_NA || '',
            ECA: record.commentaire_ECA || '',
            A: record.commentaire_A || '',
            D: record.commentaire_D || ''
          };

          parent.enfants.push({
            id: capacityId,
            titre: title,
            evaluable: true,
            commentaires: comment
          });

          configData.ponderations[capacityId] = weight;
        }
      }

      for (const [key, definition] of categoryDefinitions) {
        if (!categories.has(key)) {
          throw new Error(`La catégorie ${definition.id} n'a aucune capacité.`);
        }
      }

      for (const record of records) {
        if (normalizeType(record.type) === 'motif') {
          const categoryId = String(record.categorie_id || '').trim();
          const motifId = String(record.id || '').trim();
          const label = String(record.titre || '').trim();
          const category = [...categories.values()].find(node => node.id === categoryId);
          if (!category || !motifId || !label) continue;
          category.commentMotifs = category.commentMotifs || [];
          category.commentMotifs.push({ id: motifId, label });
        }
      }

      for (const record of records) {
        const type = normalizeType(record.type);
        if (type !== 'parametre') continue;
        const key = String(record.parametre || '').trim();
        if (!key) continue;
        const value = String(record.valeur || '').trim();
        if (!value) continue;
        if (key.startsWith('seuil.')) {
          configData.seuils[key.replace('seuil.', '')] = csvNumber(value, key);
        } else if (key.startsWith('bonus.')) {
          configData.bonus[key.replace('bonus.', '')] = csvNumber(value, key);
        } else if (key === 'typeDevoir') {
          configData.typeDevoir = value;
        } else if (key === 'niveauDevoir') {
          configData.niveauDevoir = value;
        }
      }

      if (!Object.keys(configData.seuils).length) {
        configData.seuils = { NA_max_exclusif: 0.5, ECA_max_exclusif: 1.5, A_max_exclusif: 2.5 };
      }
      if (!Object.keys(configData.bonus).length) {
        configData.bonus = { plafond_total: 3, pas_saisie: 0.25 };
      }

      const id = `csv-${(fileName || 'grille').replace(/\.csv$/i, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')}`;
      const title = configData.typeDevoir || 'Étude critique';
      const levelLabel = configData.niveauDevoir || 'Niveau';
      const rootGrid = {
        version: 1,
        id,
        titre: `${title} — ${levelLabel}`,
        typeDevoir: title,
        niveauDevoir: levelLabel,
        niveaux: DEFAULT_LEVELS,
        elements
      };

      const partList = [...parts.values()].map(part => ({
        id: part.id,
        title: part.title,
        categories: part.categories
      }));

      return { grid: rootGrid, config: { ...config, ...configData, grille: id }, partLayout: partList };
    }

    function resetChoices() {
      leafChoices = {};
      bonusChoices = {};
      manualCategoryPercent = {};
      manualChoices = {};
      categoryEvaluations = {};
    }

    function applyCsvText(text, fileName) {
      const loaded = gridFromCsv(text, fileName);
      grid = loaded.grid;
      config = loaded.config;
      partLayout = loaded.partLayout;
      levels = Object.fromEntries(grid.niveaux.map(level => [level.id, level]));
      pageTitleEl.textContent = grid.titre;
      resetChoices();
      render();
      setStatus(`Grille chargée depuis « ${fileName} ».`, 'success');
    }

    function readCsvFile(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          applyCsvText(String(reader.result || ''), file.name);
        } catch (error) {
          setStatus(`CSV invalide : ${error.message}`, 'error');
        }
      };
      reader.onerror = () => setStatus('Lecture du fichier CSV impossible.', 'error');
      reader.readAsText(file, 'UTF-8');
    }

    function loadRepositoryGrid(entry, button) {
      if (!button) return;
      button.disabled = true;
      setStatus(`Chargement de la grille « ${entry.titre} »…`);
      fetch(entry.fichier, { cache: 'no-store' })
        .then(response => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.text();
        })
        .then(text => applyCsvText(text, entry.fichier))
        .catch(error => setStatus(`Impossible de charger « ${entry.titre} » : ${error.message}`, 'error'))
        .finally(() => {
          button.disabled = false;
          document.getElementById('importMenu').open = false;
        });
    }

    async function loadGridCatalog() {
      const catalogEl = document.getElementById('gridCatalog');
      catalogEl.innerHTML = '';
      try {
        const response = await fetch('grilles.json', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const catalog = await response.json();
        const entries = Array.isArray(catalog.grilles) ? catalog.grilles.filter(item => item && typeof item.titre === 'string' && typeof item.fichier === 'string') : [];
        const filtered = entries.filter(entry => entry.fichier.toLowerCase().includes('documents'));
        const finalEntries = filtered.length ? filtered : entries;

        if (!finalEntries.length) throw new Error('Aucune grille n’est disponible.');

        for (const entry of finalEntries) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'import-option';
          button.textContent = entry.titre;
          button.addEventListener('click', () => loadRepositoryGrid(entry, button));
          catalogEl.appendChild(button);
        }

        if (finalEntries[0]) {
          loadRepositoryGrid(finalEntries[0], catalogEl.querySelector('.import-option'));
        }
      } catch (error) {
        setStatus(`Catalogue indisponible : ${error.message}`, 'error');
      }
    }

    function renderNode(node, depth = 0, hideTitle = false) {
      const wrapper = document.createElement('section');
      wrapper.className = 'node';
      const criterionRow = document.createElement('div');
      criterionRow.className = 'criterion-row';

      if (!hideTitle) {
        const nameWrap = document.createElement('div');
        nameWrap.className = 'capacity-name';
        const titleEl = document.createElement('div');
        titleEl.textContent = node.titre;
        const weightEl = document.createElement('div');
        weightEl.className = 'weight';
        weightEl.textContent = `poids : ${getWeight(node)}`;
        nameWrap.append(titleEl, weightEl);
        criterionRow.appendChild(nameWrap);
      }

      if (node.enfants && node.enfants.length) {
        const children = document.createElement('div');
        children.className = 'children';
        for (const child of node.enfants) {
          children.appendChild(renderNode(child, depth + 1, false));
        }
        criterionRow.appendChild(children);
        wrapper.appendChild(criterionRow);
        return wrapper;
      }

      const choices = document.createElement('div');
      choices.className = 'capacity-choices';
      for (const level of DEFAULT_LEVELS) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'choice-btn';
        button.dataset.level = level.id;
        const selected = leafChoices[node.id] === level.id;
        button.textContent = level.libelle;
        if (selected) button.classList.add('active');
        button.addEventListener('click', () => {
          if (leafChoices[node.id] === level.id) delete leafChoices[node.id];
          else leafChoices[node.id] = level.id;
          render();
        });
        choices.appendChild(button);
      }
      criterionRow.appendChild(choices);
      wrapper.appendChild(criterionRow);
      return wrapper;
    }

    function renderCategory(categoryNode) {
      const section = document.createElement('section');
      section.className = 'section';

      const head = document.createElement('div');
      head.className = 'section-head';

      const title = document.createElement('h2');
      title.textContent = categoryNode.titre;
      head.appendChild(title);

      const levelButtons = document.createElement('div');
      levelButtons.className = 'category-levels';
      for (const level of DEFAULT_LEVELS) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'level-btn';
        button.textContent = level.id;
        const effective = effectiveLevel(categoryNode);
        if (effective === level.id) button.classList.add('active');
        button.addEventListener('click', () => {
          if (manualChoices[categoryNode.id] === level.id) delete manualChoices[categoryNode.id];
          else manualChoices[categoryNode.id] = level.id;
          render();
        });
        levelButtons.appendChild(button);
      }
      head.appendChild(levelButtons);
      section.appendChild(head);

      const metrics = document.createElement('div');
      metrics.className = 'category-metrics';
      const percentage = getCategoryPercentage(categoryNode);
      const percentLabel = document.createElement('span');
      percentLabel.textContent = percentage === null ? 'Capacités pondérées : —' : `Capacités pondérées : ${percentage.toFixed(1).replace('.', ',')} %`;
      const coeff = document.createElement('span');
      coeff.textContent = `Coeff. catégorie : ${getCategoryCoefficient(categoryNode)}`;
      metrics.append(percentLabel, coeff);
      section.appendChild(metrics);

      const comment = document.createElement('div');
      comment.className = 'category-comment';
      const level = effectiveLevel(categoryNode) || calculate(categoryNode).level;
      const commentText = level && categoryNode.commentaires && categoryNode.commentaires[level];
      comment.textContent = commentText || 'Aucun commentaire de catégorie.';
      section.appendChild(comment);

      const childrenWrap = document.createElement('div');
      childrenWrap.className = 'children';
      for (const child of categoryNode.enfants || []) {
        childrenWrap.appendChild(renderNode(child, 1, false));
      }
      section.appendChild(childrenWrap);

      return section;
    }

    function render() {
      contentEl.innerHTML = '';
      if (!partLayout.length || !grid.elements?.length) {
        contentEl.innerHTML = '<div class="empty-state">Aucune grille chargée.</div>';
        document.getElementById('partNav').replaceChildren();
        updateFinalScore();
        return;
      }

      const partNav = document.getElementById('partNav');
      partNav.replaceChildren();
      for (const part of partLayout) {
        const partSection = document.createElement('section');
        partSection.className = 'part-section';
        partSection.id = `part-${part.id}`;

        const tab = document.createElement('button');
        tab.type = 'button';
        tab.className = 'part-tab';
        tab.setAttribute('aria-controls', partSection.id);
        tab.setAttribute('aria-label', part.title);
        const count = document.createElement('span');
        count.className = 'part-tab-count';
        const label = document.createElement('span');
        label.className = 'part-tab-label';
        label.textContent = part.title;
        tab.append(count, label);
        tab.addEventListener('click', () => {
          const top = partSection.getBoundingClientRect().top + window.scrollY - document.querySelector('header').offsetHeight - 12;
          window.scrollTo({ top, behavior: 'smooth' });
        });
        partNav.appendChild(tab);

        const leaves = (part.categories || []).flatMap(categoryRef => {
          const category = (grid.elements || []).find(node => node.id === categoryRef.nodeId);
          return category ? descendantsLeaves(category) : [];
        });
        const filled = leaves.filter(node => leafChoices[node.id]).length;
        count.textContent = `${filled}/${leaves.length}`;
        tab.classList.toggle('complete', leaves.length > 0 && filled === leaves.length);

        const heading = document.createElement('h2');
        heading.className = 'part-heading';
        heading.textContent = part.title;
        partSection.appendChild(heading);

        for (const categoryRef of part.categories || []) {
          const categoryNode = (grid.elements || []).find(node => node.id === categoryRef.nodeId);
          if (categoryNode) partSection.appendChild(renderCategory(categoryNode));
        }

        contentEl.appendChild(partSection);
      }

      updateActivePart();
      updateFinalScore();
    }

    function updateActivePart() {
      const marker = window.innerHeight * 0.32;
      let activeId = null;
      for (const part of partLayout) {
        const section = document.getElementById(`part-${part.id}`);
        if (section && section.getBoundingClientRect().top <= marker) activeId = part.id;
      }
      for (const tab of document.querySelectorAll('.part-tab')) {
        if (tab.getAttribute('aria-controls') === `part-${activeId}`) tab.setAttribute('aria-current', 'location');
        else tab.removeAttribute('aria-current');
      }
    }

    document.getElementById('resetBtn').addEventListener('click', () => {
      resetChoices();
      render();
      setStatus('Les sélections ont été réinitialisées.', 'success');
    });

    document.getElementById('printBtn').addEventListener('click', () => window.print());
    window.addEventListener('scroll', updateActivePart, { passive: true });

    document.getElementById('gridCatalog').addEventListener('click', () => {
      const menu = document.getElementById('importMenu');
      menu.open = !menu.open;
    });

    document.getElementById('finalGrade').addEventListener('input', () => {
      const value = document.getElementById('finalGrade').value.trim();
      if (!value) {
        finalScoreEl.textContent = '—/20';
        return;
      }
      if (!Number.isNaN(Number(value.replace(',', '.')))) {
        finalScoreEl.textContent = `${Number(value.replace(',', '.')).toFixed(2).replace('.', ',')}/20`;
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      pageTitleEl.textContent = 'Chargement de la grille…';
      loadGridCatalog();
    });
  </script>
</body>
