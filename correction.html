<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moteur de correction — prototype</title>
<style>
:root{color-scheme:dark;--bg:#242629;--panel:#2d3034;--muted:#44474c;--text:#f3f4f5;--sub:#bfc3c8;--line:#50545a;--red:#e45b60;--yellow:#e8c64a;--green:#49bd7b;--blue:#55a7ee}
*{box-sizing:border-box}html{background:var(--bg);scrollbar-gutter:stable}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{width:min(1080px,100%);margin-left:max(0px,calc((100vw - 1080px)/2));padding:calc(max(16.67vh,110px) + 20px) 16px 16px 96px}
.part-nav{position:fixed;z-index:10;top:max(16.67vh,110px);bottom:0;left:max(0px,calc((100vw - 1080px)/2));width:64px;display:flex;flex-direction:column;background:#292c30;border-right:1px solid var(--line);overflow-y:auto}
.part-tab{position:relative;display:block;flex:1 0 25%;min-height:100px;width:100%;padding:0;border:0;border-bottom:1px solid #55595f;border-radius:0;background:#3a3d42;color:#fff;font-size:1rem;font-weight:650;line-height:.98;overflow:hidden}
.part-tab:hover{background:#4a4e54}.part-tab[aria-current="location"]{background:#fff;color:#17191c}
.part-tab.complete::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--blue)}
.settings-option{display:flex;align-items:center;gap:10px;padding:8px 0;color:var(--text)}.settings-option input{width:18px;height:18px;accent-color:var(--blue)}
.part-tab-label{position:absolute;left:50%;top:57%;display:block;width:max(60px,calc(20.83vh - 24px));text-align:center;white-space:normal;transform:translate(-50%,-50%) rotate(-90deg)}
.part-tab-count{position:absolute;top:6px;left:0;width:100%;font-size:.68rem;font-weight:550;line-height:1;color:inherit}
.part-section{scroll-margin-top:max(16.67vh,110px);margin:0 0 28px}
.part-heading{font-size:1.55rem;font-weight:800;line-height:1.2;color:#a9adb2;margin:0 0 16px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.category-placeholder{padding:12px 14px;border-top:1px solid #3c3f44}
header{position:fixed;z-index:20;inset:0 0 auto;height:max(16.67vh,110px);display:grid;grid-template-columns:5fr 3fr;align-items:center;gap:12px;padding:10px 18px;background:rgba(36,38,41,.98);border-bottom:1px solid var(--line)}
.header-left{grid-column:1;min-width:0}.header-left h1{font-size:1.25rem;line-height:1.15;margin:0 0 10px}h2{font-size:1.05rem;margin:0 0 6px}
.student-name{width:min(100%,360px);height:34px;padding:6px 10px;border:1px solid #62666d;border-radius:6px;background:#1b1d20;color:#fff;font:inherit;font-size:.9rem}
.header-score{display:block;min-width:0;margin-top:6px;font-size:1.3rem;font-weight:800;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
.header-actions{grid-column:2;display:grid;grid-template-columns:repeat(4,44px);justify-content:start;align-content:center;gap:8px;margin:0}
button,.filelabel{font:inherit;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:#3a3d42;color:var(--text);cursor:pointer}
button:focus-visible,.filelabel:focus-within{outline:2px solid white;outline-offset:2px}button.secondary{background:transparent}
.icon-button,.icon-file{display:grid;place-items:center;width:44px;height:44px;padding:0;border:1px solid #5a5e64;border-radius:7px;background:#34373b;color:#fff}
.icon-button:hover,.icon-file:hover{background:#4a4e54}.icon-button svg,.icon-file svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.import-menu{position:relative}.import-menu>summary{list-style:none;cursor:pointer}.import-menu>summary::-webkit-details-marker{display:none}
.import-options{position:absolute;z-index:40;top:calc(100% + 6px);right:0;display:none;min-width:210px;padding:4px;border:1px solid var(--line);border-radius:6px;background:var(--panel);box-shadow:0 6px 18px rgba(0,0,0,.4)}
.import-menu[open] .import-options{display:grid}
.import-option{padding:9px 10px;border-radius:4px;color:var(--text);font-size:.85rem;white-space:nowrap;cursor:pointer}.import-option:hover{background:#4a4e54}
.import-heading{margin:5px 8px 3px;color:var(--sub);font-size:.7rem;font-weight:700;text-transform:uppercase}
.import-catalog{display:grid}.import-catalog-button{width:100%;padding:9px 10px;border:0;border-radius:4px;background:transparent;text-align:left;white-space:normal}.import-catalog-button:hover{background:#4a4e54}
.import-separator{height:1px;margin:4px 6px;background:var(--line)}
input[type=file]{position:fixed;left:-10000px;width:1px;height:1px;opacity:0}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.status-toast{position:fixed;z-index:30;top:calc(max(16.67vh,110px) + 8px);left:50%;transform:translateX(-50%);max-width:calc(100vw - 24px);padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text);box-shadow:0 4px 16px rgba(0,0,0,.35);font-size:.85rem}
.status-toast[data-kind="error"]{border-color:var(--red)}
.header-score output{display:block}
dialog{width:min(420px,calc(100vw - 32px));border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.65)}.dialog-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.section{margin:18px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden}.section-head{background:var(--panel);padding:12px 14px}
.node{padding:12px;border-top:1px solid #3c3f44}.node.group{background:rgba(255,255,255,.015)}
.node.depth-1{margin-left:10px}.node.depth-2{margin-left:18px}.node.depth-3{margin-left:26px}
.node-title{font-weight:650;margin:0}.criterion-row{display:grid;grid-template-columns:minmax(200px,1.2fr) minmax(0,2.8fr);gap:12px;align-items:start}.criterion-row.category-summary{grid-template-columns:minmax(0,1fr)}.capacity-name{display:flex;flex-direction:column;gap:4px;min-width:0}.capacity-name .weight{font-size:.72rem;color:var(--sub);font-weight:600}.capacity-choices{display:grid;grid-template-columns:repeat(1,minmax(0,1fr));gap:6px}.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;width:100%}
.level-btn{height:48px;min-height:48px;border:2px solid transparent;background:var(--muted);color:#f5f5f5;padding:7px 3px;font-weight:650;font-size:.72rem;line-height:1.2;min-width:0;white-space:normal;word-break:break-word}.choice-btn{border:1px solid var(--line);background:#2b2f33;color:var(--text);padding:8px 8px;text-align:left;line-height:1.35;min-height:48px;font:inherit;font-size:.7rem;font-weight:400;border-radius:8px;cursor:pointer;white-space:normal;word-break:break-word;display:flex;align-items:center}.choice-btn.active{background:var(--level-color);border-color:var(--level-color);color:#1b1d20}.level-btn .abbr{display:block;font-size:1rem}.level-btn .full{display:block;font-size:.68rem;font-weight:450;opacity:.9}
.level-btn.suggested{border-color:var(--level-color);background:var(--muted)}
.level-btn.manual{background:var(--level-color);border-color:var(--level-color);color:#202124}
.level-btn.final-selected{font-weight:650}
.level-btn.d-bonus{background:var(--blue);border-color:var(--blue);color:#111}.level-btn.d-bonus.active{box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.meta{display:flex;flex-wrap:nowrap;gap:8px;margin-top:8px;align-items:center;height:30px;overflow:hidden}
.pill{font-size:.75rem;border:1px solid var(--line);border-radius:999px;padding:3px 8px;color:var(--sub)}
.pill.partial{border-color:var(--yellow);color:var(--yellow)}.pill.manualtag{border-color:#aaa;color:#ddd}
.comment{height:4.5rem;box-sizing:border-box;overflow:auto;margin:9px 0 0;padding:9px 10px;border-left:2px solid #666;background:#292c30;color:#d9dce0;font-size:.9rem}.comment.empty{visibility:hidden}
.children{margin-top:8px}.children .node{border-radius:8px;margin-top:8px;border:1px solid #3c3f44}
.bonus-row{display:flex;gap:8px;align-items:stretch;margin-top:9px;flex-wrap:wrap}
.bonus-toggle{border:2px solid transparent;background:#44474c;color:#f5f5f5;min-width:90px}
.bonus-toggle.active{background:var(--blue);border-color:var(--blue);color:#111}
.bonus-controls{display:flex;align-items:center;gap:8px;flex:1;min-width:180px}
.bonus-controls label{font-size:.82rem;color:var(--sub)}
.bonus-controls input{width:86px;background:#1b1d20;color:#fff;border:1px solid #62666d;border-radius:7px;padding:8px;font:inherit}
.bonus-help{font-size:.78rem;color:var(--sub);align-self:center}
@media(min-width:700px){.capacity-choices{grid-template-columns:repeat(4,minmax(0,1fr))}.app{padding:calc(max(16.67vh,110px) + 20px) 20px 20px 100px}.node{padding:14px}.level-btn{min-height:48px;height:48px}.choice-btn{font-size:.68rem;min-height:52px}}
@media(max-width:900px) and (min-width:700px){.header-actions{grid-template-columns:repeat(4,38px);gap:5px}.icon-button,.icon-file{width:38px;height:38px}}
@media(max-width:699px){.app{padding:calc(max(16.67vh,110px) + 14px) 10px 16px 80px}.part-nav{width:56px}.part-tab{min-height:80px;font-size:.9rem}.part-tab-label{width:max(56px,calc(20.83vh - 28px))}header{grid-template-columns:minmax(0,5fr) minmax(104px,3fr);gap:5px;padding:8px}.header-left h1{font-size:1rem;margin-bottom:6px}.student-name{height:30px;padding:4px 6px;font-size:.78rem}.header-score{font-size:1.1rem}.header-actions{grid-template-columns:repeat(3,34px);gap:4px}.icon-button,.icon-file{width:34px;height:34px;border-radius:6px}.icon-button svg,.icon-file svg{width:18px;height:18px}.criterion-row{grid-template-columns:minmax(0,1fr)}.level-btn{height:56px;min-height:56px}}
.section-head.category-head{padding:6px 10px}.category-heading-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:36px}.category-heading-row h2{min-width:0;margin:0;font-size:1.18rem}.category-levels{display:flex;gap:6px;flex:none}.category-levels .level-btn{width:52px;height:36px;min-height:36px;padding:2px}.category-levels .full{display:none}.category-metrics{display:none;align-items:center;gap:8px;height:26px;margin-top:3px;overflow:hidden}.app.show-metrics .category-metrics{display:flex}.category-comment{height:2.5rem;overflow:auto;margin:2px 0 0;color:var(--sub);font-size:.85rem;line-height:1.3}.category-comment.empty{visibility:hidden}
.part-heading{font-size:1.55rem;font-weight:800;line-height:1.2;color:#a9adb2;margin:0 0 16px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.node.group{background:transparent}.node.depth-1{margin-left:4px}.node.depth-2{margin-left:8px}.node.depth-3{margin-left:12px}
.criterion-row{grid-template-columns:minmax(115px,.72fr) minmax(0,3.28fr);gap:8px}.capacity-name{gap:2px;font-size:.84rem;line-height:1.12}.capacity-name .weight{display:none}.app.show-metrics .capacity-name .weight{display:block}.node.depth-1>.criterion-row .node-title{color:var(--panel);font-size:.96rem}
.capacity-choices{gap:4px}.children{margin-top:2px}.children .node{border:0;border-radius:0;margin-top:2px;padding:5px 0;background:transparent}.section>.node.depth-0{padding:0;border-top:0;background:transparent}
.choice-btn.active{background:#44474c;background:color-mix(in srgb,var(--level-color) 44%,#44474c);border-color:color-mix(in srgb,var(--level-color) 62%,#686b70);color:#fff}
@media(max-width:699px){.category-heading-row{align-items:flex-start;gap:4px}.category-levels{gap:3px}.category-levels .level-btn{width:36px;height:34px;min-height:34px;padding:2px 1px;font-size:.65rem}.category-comment{height:2.5rem}}
.part-heading{font-size:1.8rem;font-weight:800;line-height:1.15;color:#858a90}
.node.depth-1>.criterion-row .node-title{color:#858a90;font-size:1.02rem}
.section-head.category-head{border-bottom:0}
.section>.node.depth-0{padding-right:10px;padding-left:10px}
.header-fields{display:flex;gap:8px;width:min(100%,720px)}.header-fields .student-name{flex:1 1 0;width:0;min-width:0}.header-score{color:#969ba1;font-size:1.05rem;font-weight:600}
@media(max-width:699px){.header-fields{gap:5px}.header-fields .student-name{padding:4px 5px;font-size:.72rem}.header-score{font-size:1.05rem}}
@media print{
  :root{color-scheme:light}
  body{background:#fff!important;color:#111!important;font-size:10pt}
  .app{width:auto;margin:0;padding:0}
  .part-nav{display:none!important}
  .part-section{break-after:page}
  header{position:static;height:auto;display:grid;background:#fff;color:#111;border-bottom:1px solid #888;padding:0 0 8px}
  h1{font-size:16pt}
  .no-print,.header-actions,.pill,.bonus-toggle,.bonus-controls,.bonus-help{display:none!important}
  .section{border:1px solid #888;overflow:visible;break-inside:avoid}
  .section-head{background:#fff;color:#111;border-bottom:1px solid #aaa}
  .node,.node.group,.children .node{background:#fff!important;border-color:#ccc!important;color:#111;margin-left:0;padding:8px;break-inside:avoid}
  .node-title{color:#111}.levels{gap:5px}
  .level-btn,.level-btn.suggested,.level-btn.manual,.level-btn.final-selected{background:#fff!important;border:1px solid transparent!important;box-shadow:none!important;color:#bbb!important;min-height:0;padding:3px 1px}
  .level-btn.final-selected{color:#111!important;font-weight:800!important}
  .level-btn .full{color:inherit}
  .comment{background:#fff;border-left:1px solid #ccc;color:#333;padding:4px 6px}
  .bonus-print-reason{display:block!important;margin:6px 0 0;padding:4px 6px;border-left:1px solid #888;color:#222;font-size:9pt}
  footer{display:none}
}
.bonus-print-reason{display:none}
</style>
</head>
<body>
<div class="app">
<nav class="part-nav no-print" id="partNav" aria-label="Navigation des parties"></nav>
<header aria-label="En-tête">
  <div class="header-left">
    <h1 id="pageTitle">Étude critique de document(s)</h1>
    <div class="header-fields">
      <input id="studentName" class="student-name" type="text" placeholder="Nom de l’élève" aria-label="Nom de l’élève">
      <input id="finalGrade" class="student-name final-grade" type="text" placeholder="Note finale" aria-label="Note finale">
    </div>
    <div class="header-score" aria-label="Proposition de note finale avec bonus"><output id="finalScore">—/20</output></div>
  </div>
  <div class="header-actions no-print" aria-label="Actions">
    <details class="import-menu" id="importMenu"><summary class="icon-button" title="Importer une grille" aria-label="Importer une grille"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg></summary><div class="import-options"><p class="import-heading">Grilles du dépôt</p><div class="import-catalog" id="gridCatalog">Chargement du catalogue…</div><div class="import-separator"></div><label class="import-option" for="gridCsvInput">CSV depuis l’ordinateur…</label><label class="import-option" for="gridInput">Grille JSON…</label><label class="import-option" for="configInput">Paramètres JSON…</label></div></details>
    <button id="printBtn" class="icon-button" type="button" title="Imprimer / PDF" aria-label="Imprimer / PDF"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V3h12v6M6 17H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v7H6zM18 12h.01"/></svg></button>
    <button id="resetBtn" class="icon-button" type="button" title="Réinitialiser les choix" aria-label="Réinitialiser les choix"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h9a7 7 0 1 1-6.2 10.2"/></svg></button>
    <button id="settingsBtn" class="icon-button" type="button" title="Configuration" aria-label="Configuration"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19.4 13.5 1.2.9-1.2 2.1-1.4-.5a7.7 7.7 0 0 1-1.6.9l-.2 1.5h-2.4l-.3-1.5a7.7 7.7 0 0 1-1.6-.9l-1.4.5-1.2-2.1 1.2-.9a7 7 0 0 1 0-1.9l-1.2-.9 1.2-2.1 1.4.5a7.7 7.7 0 0 1 1.6-.9l.3-1.5h2.4l.2 1.5a7.7 7.7 0 0 1 1.6.9l1.4-.5 1.2 2.1-1.2.9a7 7 0 0 1 0 1.9Z"/></svg></button>
  </div>
</header>
<input id="gridInput" type="file" accept=".json,application/json" aria-label="Charger la grille JSON">
<input id="configInput" type="file" accept=".json,application/json" aria-label="Charger les paramètres JSON">
<input id="gridCsvInput" type="file" accept=".csv,text/csv" aria-label="Charger une grille CSV complète">
<div id="status" class="sr-only" role="status" aria-live="polite"></div>
<dialog id="settingsDialog"><div class="dialog-heading"><h2>Configuration</h2><button id="closeSettings" class="icon-button" type="button" aria-label="Fermer la configuration">×</button></div><label class="settings-option"><input id="showMetrics" type="checkbox">Métriques de calcul</label></dialog>
<main id="content"></main>
</div>
<script>
const DEFAULT_GRID = {"version": 1, "id": "etude-critique-introduction-conclusion-v1", "titre": "Étude critique — Introduction et conclusion", "niveaux": [{"id": "NA", "libelle": "Non acquis", "valeur": 0, "couleur": "#e45b60"}, {"id": "ECA", "libelle": "En cours d'acquisition", "valeur": 1, "couleur": "#e8c64a"}, {"id": "A", "libelle": "Acquis", "valeur": 2, "couleur": "#49bd7b"}], "elements": [{"id": "introduction-conclusion", "titre": "Introduction et conclusion", "evaluable": true, "commentaires": {"NA": "Début et fin du devoir absents, très limités et/ou maladroits.", "ECA": "Commentaire à préciser à partir de la grille définitive.", "A": "Première et dernière impression très positive : le sujet est compris.", "D": "Commentaire à confirmer à partir de la grille source."}, "enfants": [{"id": "introduction", "titre": "Introduction", "evaluable": true, "commentaires": {}, "enfants": [{"id": "accroche", "titre": "Commencer par une accroche", "evaluable": true, "commentaires": {"NA": "Pas d'accroche.", "ECA": "Accroche présente mais imprécise / déconnectée.", "A": "Accroche efficace et intéressante.", "D": "Accroche et contextualisation s'appuyant sur une culture personnelle."}}, {"id": "definition-termes", "titre": "Définir les termes du sujet", "evaluable": true, "commentaires": {"NA": "Pas de contexte / définitions erronées.", "ECA": "Contextualisation donnant globalement le sens du sujet.", "A": "Bonne maîtrise des notions et enjeux disciplinaires.", "D": "Commentaire à confirmer à partir de la grille source."}}, {"id": "problematique", "titre": "Proposer une problématique", "evaluable": true, "commentaires": {"NA": "Problématique absente ou maladroite, restrictive / menant à un hors-sujet.", "ECA": "Simple reprise du sujet, reformulation sans pertinence mais convenable.", "A": "Questionnement montrant que l'intérêt et la portée du sujet sont bien compris.", "D": "Commentaire à confirmer à partir de la grille source."}}, {"id": "annonce-plan", "titre": "Annoncer le plan", "evaluable": true, "commentaires": {"NA": "Pas d'annonce de plan / annonce très confuse.", "ECA": "Annonce sommaire / plutôt approximative du plan.", "A": "Annonce efficace et qui oriente le devoir.", "D": "Commentaire à confirmer à partir de la grille source."}}]}, {"id": "conclusion", "titre": "Conclusion", "evaluable": true, "commentaires": {}, "enfants": [{"id": "synthese", "titre": "Formuler une synthèse", "evaluable": true, "commentaires": {"NA": "Pas de conclusion.", "ECA": "Phrase conclusive simple / anecdotique / confuse.", "A": "Véritable réponse à la problématique.", "D": "Commentaire à confirmer à partir de la grille source."}}, {"id": "ouverture", "titre": "Proposer une ouverture", "evaluable": true, "commentaires": {"NA": "Pas d'ouverture.", "ECA": "Présence d'une ouverture mais plutôt artificielle.", "A": "Réelle mise en perspective du sujet.", "D": "Commentaire à confirmer à partir de la grille source."}}]}]}], "description": "NA, ECA et A sont des niveaux de maîtrise exclusifs. D est une bonification indépendante : le texte D décrit le motif de valorisation."};
const DEFAULT_CONFIG = {"version": 1, "grille": "etude-critique-introduction-conclusion-v1", "description": "Paramètres de départ à ajuster après essais pédagogiques. D est une bonification indépendante, plafonnée au total indiqué.", "ponderations": {"accroche": 1, "definition-termes": 2, "problematique": 3, "annonce-plan": 2, "synthese": 2, "ouverture": 1}, "seuils": {"NA_max_exclusif": 0.5, "ECA_max_exclusif": 1.5, "A_max_exclusif": 2.5}, "bonus": {"plafond_total": 3, "pas_saisie": 0.25}};
const PART_LAYOUT = [
  {id:"organisation-du-devoir",title:"Organisation du devoir",categories:[{nodeId:"introduction-conclusion",title:"Introduction et conclusion"}]},
  {id:"documents",title:"Documents",categories:[
    {title:"Nature et source des documents",description:"Catégorie fictive à remplacer par les critères définitifs de la grille."},
    {title:"Sélection des informations",description:"Capacités fictives à préciser pour le prototype."}
  ]},
  {id:"analyse",title:"Analyse",categories:[
    {title:"Compréhension des enjeux",description:"Catégorie fictive à remplacer par les critères définitifs de la grille."},
    {title:"Construction du raisonnement",description:"Capacités fictives à préciser pour le prototype."}
  ]},
  {id:"forme",title:"Forme",categories:[
    {title:"Expression écrite",description:"Catégorie fictive à remplacer par les critères définitifs de la grille."},
    {title:"Présentation du devoir",description:"Capacités fictives à préciser pour le prototype."}
  ]}
];
let partLayout = PART_LAYOUT;
let grid = structuredClone(DEFAULT_GRID);
let config = structuredClone(DEFAULT_CONFIG);
let manualChoices = {};
let leafChoices = {};
let bonusChoices = {};
let levels = Object.fromEntries(grid.niveaux.map(l=>[l.id,l]));

function allNodes(nodes,result=[]){for(const n of nodes||[]){result.push(n);allNodes(n.enfants,result)}return result}
function isLeaf(n){return !n.enfants||n.enfants.length===0}

function calculate(node){

  if(!count)return{level:null,mean:null,count,total,partial:total>0};
  const weightedTotal=scored.reduce((s,x)=>s+x.score*x.weight,0),weightTotal=scored.reduce((s,x)=>s+x.weight,0),mean=weightedTotal/weightTotal,t=config.seuils||{};

function effectiveLevel(node){if(isLeaf(node))return leafChoices[node.id]||null;if(Object.hasOwn(manualChoices,node.id))return manualChoices[node.id];return calculate(node).level}
function getCategoryPercentage(node){

}
function chosenOrigin(node){if(isLeaf(node))return leafChoices[node.id]?"manual":"none";if(Object.hasOwn(manualChoices,node.id))return"manual";return calculate(node).level?"auto":"none"}
function totalBonus(){return Object.values(bonusChoices).reduce((s,v)=>s+(Number(v)||0),0)}

function setBonus(node,value){
  const cap=bonusCap(),other=totalBonus()-(Number(bonusChoices[node.id])||0);
  let n=Math.max(0,Number(value)||0);n=Math.min(n,Math.max(0,cap-other));

function makeChoiceButton(node, level, selected, commentText, isBonus=false){

      else setBonus(node,Math.min(0.5,Math.max(0,bonusCap()-totalBonus())));
      render();
      return;
    }

function makeLevelButton(node,level,effective,origin,suggested,isBonus=false){

    if(isBonus){
      if(bonusChoices[node.id])delete bonusChoices[node.id];

      render();

    }

function renderNode(node,depth=0,hideTitle=false){
  const wrap=document.createElement("section");wrap.className=`node ${isLeaf(node)?"leaf":"group"} depth-${Math.min(depth,3)}`;

  const nameText=document.createElement("div");nameText.className="node-title";nameText.textContent=node.titre;
  const weightText=document.createElement("div");weightText.className="weight";weightText.textContent=`poids:${getWeight(node)}`;
  nameBlock.appendChild(nameText);nameBlock.appendChild(weightText);
  const criterionRow=document.createElement("div");criterionRow.className="criterion-row";

  if(!hideTitle)criterionRow.appendChild(nameBlock);

  if(!isLeaf(node) && depth > 0){
    wrap.appendChild(criterionRow);

    for(const child of node.enfants)children.appendChild(renderNode(child,depth+1));
    wrap.appendChild(children);

  if(!isLeaf(node) && depth === 0){
    const children=document.createElement("div");children.className="children";

    const isBonus = l.id === "D";
    const commentText = isBonus ? (node.commentaires?.D || "Commentaire à confirmer à partir de la grille source.") : (node.commentaires?.[l.id] || l.libelle);
    const selected = isBonus ? Boolean(bonusChoices[node.id]) : eff === l.id;
    selectionWrap.appendChild(makeChoiceButton(node,l,selected,commentText,isBonus));
  }
  criterionRow.appendChild(selectionWrap);
  wrap.appendChild(criterionRow);
  return wrap;
}

function updatePartCounts(roots){

  for(const part of partLayout){
    const nodes=part.categories.map(category=>roots.find(root=>root.id===category.nodeId)).filter(Boolean);
    if(part.id===partLayout[0].id)nodes.push(...roots.filter(root=>!mappedIds.has(root.id)));
    const leaves=nodes.flatMap(descendantsLeaves),filled=leaves.filter(node=>leafChoices[node.id]).length;
    const button=partNavEl.querySelector(`[aria-controls="part-${part.id}"]`);

    button.classList.toggle("complete",leaves.length>0&&filled===leaves.length);
    button.setAttribute("aria-label",`${part.title}, ${filled} capacité(s) renseignée(s) sur ${leaves.length}`);

}

function render(){

    const partSection=document.createElement("section");partSection.className="part-section";partSection.id=`part-${part.id}`;
    const heading=document.createElement("h2");heading.className="part-heading";heading.textContent=part.title;partSection.appendChild(heading);
    for(const category of part.categories){
      const node=category.nodeId?roots.find(root=>root.id===category.nodeId):null;
      const missing=category.nodeId&&!node?{...category,description:"Cette catégorie n'est pas présente dans la grille actuellement chargée."}:category;
      partSection.appendChild(renderCategory(missing,node));
    }
    if(part.id===partLayout[0].id){
      for(const node of roots.filter(root=>!mappedIds.has(root.id)))
        partSection.appendChild(renderCategory({title:node.titre},node));
    }
    contentEl.appendChild(partSection);

  }).filter(Boolean);

function detectCsvDelimiter(text){
  const firstLine=text.split(/\r\n|\n|\r/,1)[0]||"";let quoted=false,commas=0,semicolons=0;
  for(let index=0;index<firstLine.length;index++){
    const character=firstLine[index];
    if(character==='"'){
      if(quoted&&firstLine[index+1]==='"'){index++;continue}
      quoted=!quoted;
    }else if(!quoted&&character===",")commas++;
    else if(!quoted&&character===";")semicolons++;
  }
  return semicolons>commas?";":",";
}
function parseCsv(text){
  const source=text.replace(/^\uFEFF/,"");const delimiter=detectCsvDelimiter(source);const rows=[];
  let row=[],field="",quoted=false;
  for(let index=0;index<source.length;index++){
    const character=source[index];
    if(quoted){
      if(character==='"'){
        if(source[index+1]==='"'){field+='"';index++}
        else quoted=false;
      }else field+=character;
    }else if(character==='"'&&field.length===0)quoted=true;
    else if(character===delimiter){row.push(field);field=""}
    else if(character==="\n"||character==="\r"){
      if(character==="\r"&&source[index+1]==="\n")index++;
      row.push(field);if(row.some(value=>value.trim()!==""))rows.push(row);row=[];field="";
    }else field+=character;
  }
  if(quoted)throw new Error("un guillemet CSV n'est pas refermé.");
  if(field.length||row.length){row.push(field);if(row.some(value=>value.trim()!==""))rows.push(row)}
  if(rows.length<2)throw new Error("le fichier ne contient aucune donnée.");
  const headers=rows.shift().map(value=>value.trim());
  if(new Set(headers).size!==headers.length)throw new Error("les noms de colonnes doivent être uniques.");
  const required=["type","partie","categorie","sous_categorie","id","titre","evaluable","commentaire_NA","commentaire_ECA","commentaire_A","commentaire_D","ponderation","ordre","parametre","valeur","coefficient_categorie"];
  const missing=required.filter(header=>!headers.includes(header));
  if(missing.length)throw new Error(`colonnes manquantes : ${missing.join(", ")}.`);
  return rows.map((values,index)=>{
    if(values.length>headers.length)throw new Error(`la ligne ${index+2} contient trop de colonnes.`);
    return Object.fromEntries(headers.map((header,column)=>[header,(values[column]||"").trim()]));
  });
}
function csvNumber(value,label){
  const number=Number(String(value).trim().replace(",","."));
  if(!Number.isFinite(number))throw new Error(`${label} doit être un nombre.`);
  return number;
}
function gridFromCsv(text,fileName){
  const records=parseCsv(text);const capacityRows=[],parameterRows=[];
  for(const record of records){
    if(record.type==="capacite")capacityRows.push(record);
    else if(record.type==="parametre")parameterRows.push(record);
    else throw new Error(`type de ligne inconnu : « ${record.type} ».`);
  }
  if(!capacityRows.length)throw new Error("aucune ligne de capacité n'a été trouvée.");
  capacityRows.sort((left,right)=>{
    const leftOrder=left.ordre?csvNumber(left.ordre,"L'ordre"):Number.POSITIVE_INFINITY;
    const rightOrder=right.ordre?csvNumber(right.ordre,"L'ordre"):Number.POSITIVE_INFINITY;
    return leftOrder-rightOrder;
  });
  let nextGroupId=0;const nextGroup=title=>({id:`__csv_node_${++nextGroupId}`,titre:title,evaluable:false,enfants:[]});
  const elements=[],parts=new Map(),categories=new Map(),subcategories=new Map(),capacityIds=new Set();
  const config=structuredClone(DEFAULT_CONFIG);config.ponderations={};config.coefficientsCategories={};
  for(const row of capacityRows){
    const partTitle=row.partie,categoryTitle=row.categorie,subcategoryTitle=row.sous_categorie==="_"?"":row.sous_categorie,capacityId=row.id,title=row.titre;
    if(!partTitle||!categoryTitle||!capacityId||!title)throw new Error("chaque capacité doit renseigner partie, catégorie, id et titre.");
    if(capacityId.startsWith("__csv_node_")||capacityIds.has(capacityId))throw new Error(`identifiant de capacité invalide ou répété : « ${capacityId} ».`);
    const evaluable=row.evaluable.toLowerCase();
    if(!["true","1","oui","vrai"].includes(evaluable))throw new Error(`la capacité « ${title} » doit être évaluable.`);
    const weight=csvNumber(row.ponderation,`La pondération de « ${title} »`);
    if(weight<=0)throw new Error(`la pondération de « ${title} » doit être supérieure à zéro.`);
    capacityIds.add(capacityId);
    let part=parts.get(partTitle);
    if(!part){part={id:`csv-part-${parts.size+1}`,title:partTitle,categories:[]};parts.set(partTitle,part)}
    const categoryKey=JSON.stringify([partTitle,categoryTitle]);
    let category=categories.get(categoryKey);
    if(!category){category=nextGroup(categoryTitle);categories.set(categoryKey,category);elements.push(category);part.categories.push({nodeId:category.id,title:categoryTitle})}
    if(row.coefficient_categorie){
      const coefficient=csvNumber(row.coefficient_categorie,`Le coefficient de la catégorie « ${categoryTitle} »`);
      if(coefficient<=0)throw new Error(`le coefficient de la catégorie « ${categoryTitle} » doit être supérieur à zéro.`);
      const previous=config.coefficientsCategories[category.id];
      if(previous!==undefined&&previous!==coefficient)throw new Error(`le coefficient de la catégorie « ${categoryTitle} » doit être identique sur toutes ses lignes renseignées.`);
      config.coefficientsCategories[category.id]=coefficient;
    }
    let parent=category;
    if(subcategoryTitle){
      const subcategoryKey=JSON.stringify([partTitle,categoryTitle,subcategoryTitle]);
      let subcategory=subcategories.get(subcategoryKey);
      if(!subcategory){subcategory=nextGroup(subcategoryTitle);subcategories.set(subcategoryKey,subcategory);category.enfants.push(subcategory)}
      parent=subcategory;
    }
    parent.enfants.push({id:capacityId,titre:title,evaluable:true,commentaires:{NA:row.commentaire_NA,ECA:row.commentaire_ECA,A:row.commentaire_A,D:row.commentaire_D}});
    config.ponderations[capacityId]=weight;
  }
  for(const category of categories.values())if(!Object.hasOwn(config.coefficientsCategories,category.id))throw new Error(`la catégorie « ${category.titre} » doit indiquer un coefficient_categorie.`);
  const requiredParameters=["seuil.NA_max_exclusif","seuil.ECA_max_exclusif","seuil.A_max_exclusif","bonus.plafond_total","bonus.pas_saisie"];
  const seenParameters=new Set();
  for(const row of parameterRows){
    const key=row.parametre;
    if(!requiredParameters.includes(key)||seenParameters.has(key))throw new Error(`paramètre inconnu ou répété : « ${key} ».`);
    const value=csvNumber(row.valeur,`Le paramètre « ${key} »`);const [section,name]=key.split(".");
    if(section==="seuil")config.seuils[name]=value;
    else config.bonus[name]=value;
    seenParameters.add(key);
  }
  const missingParameters=requiredParameters.filter(key=>!seenParameters.has(key));
  if(missingParameters.length)throw new Error(`paramètres manquants : ${missingParameters.join(", ")}.`);
  const id=`csv-${fileName.replace(/\.csv$/i,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}`;
  const grid={...structuredClone(DEFAULT_GRID),id,titre:fileName.replace(/\.csv$/i,"").replace(/[_-]+/g," "),elements};
  config.grille=id;
  return{grid,config,partLayout:[...parts.values()]};
}
function readJsonFile(file,callback){const reader=new FileReader();reader.onload=()=>{try{callback(JSON.parse(reader.result))}catch(error){setStatus("Impossible de lire ce JSON : "+error.message,"error")}};reader.onerror=()=>setStatus("La lecture du fichier a échoué.","error");reader.readAsText(file)}
function resetChoices(){manualChoices={};leafChoices={};bonusChoices={}}
function applyCsvText(text,fileName){
  const loaded=gridFromCsv(text,fileName);grid=loaded.grid;config=loaded.config;partLayout=loaded.partLayout;levels=Object.fromEntries(grid.niveaux.map(level=>[level.id,level]));

async function loadRepositoryGrid(entry,button){
  button.disabled=true;setStatus(`Chargement de la grille « ${entry.titre} »…`);
  try{
    const url=new URL(entry.fichier,document.baseURI);
    if(url.origin!==location.origin)throw new Error("le fichier doit être hébergé sur le même site.");
    const response=await fetch(url);
    if(!response.ok)throw new Error(`réponse HTTP ${response.status}.`);
    applyCsvText(await response.text(),entry.fichier);
  }catch(error){setStatus(`Impossible de charger « ${entry.titre} » : ${error.message}`,"error")}
  finally{button.disabled=false;document.getElementById("importMenu").open=false}
}
async function loadGridCatalog(){

    const response=await fetch(new URL("grilles.json",document.baseURI),{cache:"no-cache"});
    if(!response.ok)throw new Error(`réponse HTTP ${response.status}.`);
    const catalog=await response.json();
    if(!Array.isArray(catalog.grilles)||!catalog.grilles.length)throw new Error("aucune grille n'est déclarée.");
    const buttons=catalog.grilles.map(entry=>{
      if(!entry||typeof entry.titre!=="string"||typeof entry.fichier!=="string"||!entry.fichier.toLowerCase().endsWith(".csv"))throw new Error("une entrée du catalogue est invalide.");
      const button=document.createElement("button");button.type="button";button.className="import-option import-catalog-button";button.textContent=entry.titre;
      button.addEventListener("click",()=>loadRepositoryGrid(entry,button));return button;
    });
    catalogEl.replaceChildren(...buttons);
  }catch(error){catalogEl.textContent="Catalogue indisponible.";setStatus(`Impossible de charger le catalogue des grilles : ${error.message}`,"error")}
}
function readCsvFile(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{applyCsvText(String(reader.result||""),file.name)}catch(error){setStatus("CSV invalide : "+error.message,"error")}
  };
  reader.onerror=()=>setStatus("La lecture du fichier CSV a échoué.","error");reader.readAsText(file,"UTF-8");
}
document.getElementById("gridCsvInput").addEventListener("change",event=>{const file=event.target.files?.[0];event.target.value="";document.getElementById("importMenu").open=false;if(file)readCsvFile(file)});
document.getElementById("gridInput").addEventListener("change",event=>{const file=event.target.files?.[0];event.target.value="";document.getElementById("importMenu").open=false;if(!file)return;readJsonFile(file,data=>{if(!data.elements||!data.niveaux){setStatus("Ce fichier ne ressemble pas à une définition de grille valide.","error");return}grid=data;partLayout=PART_LAYOUT;levels=Object.fromEntries(grid.niveaux.map(level=>[level.id,level]));initializePartNav();resetChoices();render();setStatus("Grille JSON chargée. Les choix précédents ont été réinitialisés.")})});
document.getElementById("configInput").addEventListener("change",event=>{const file=event.target.files?.[0];event.target.value="";document.getElementById("importMenu").open=false;if(!file)return;readJsonFile(file,data=>{if(!data.ponderations||!data.seuils){setStatus("Paramétrage invalide : pondérations ou seuils absents.","error");return}config=data;const cap=bonusCap();let left=cap;for(const id of Object.keys(bonusChoices)){const value=Math.min(bonusChoices[id],left);bonusChoices[id]=value;left-=value;if(value<=0)delete bonusChoices[id]}render();setStatus("Paramétrage JSON chargé. Pondérations, seuils et plafond de bonus actualisés.")})});
document.getElementById("printBtn").addEventListener("click",()=>window.print());
document.getElementById("resetBtn").addEventListener("click",()=>{manualChoices={};leafChoices={};bonusChoices={};render();setStatus("Tous les choix et bonus ont été réinitialisés.")});
document.getElementById("settingsBtn").addEventListener("click",()=>document.getElementById("settingsDialog").showModal());
document.getElementById("closeSettings").addEventListener("click",()=>document.getElementById("settingsDialog").close());
document.getElementById("showMetrics").addEventListener("change",event=>document.querySelector(".app").classList.toggle("show-metrics",event.target.checked));
window.addEventListener("beforeprint",()=>{
  document.querySelectorAll(".level-btn").forEach(b=>{b.classList.remove("manual","suggested","final-selected")});
  document.querySelectorAll(".node").forEach(nodeEl=>{const buttons=[...nodeEl.querySelectorAll(":scope > .levels .level-btn")];const selected=buttons.find(b=>b.getAttribute("aria-pressed")==="true");if(selected)selected.classList.add("final-selected")});
});
window.addEventListener("afterprint",render);
initializePartNav();
window.addEventListener("scroll",updateActivePart,{passive:true});
render();
loadGridCatalog();
</script>
</body></html>
